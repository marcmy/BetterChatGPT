name: Tag BetterChatGPT v1.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-v1.1.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify package and create v1.1 tag
        shell: bash
        run: |
          set -euo pipefail
          echo '1bae81ab244260292144481b72f68bf16928dd35ce8427fa78467fe6185720b6  artifacts/BetterChatGPT-chromium-v1.1.zip' | sha256sum -c -
          test "$(python3 -c 'import json; print(json.load(open("chromium/manifest.json"))["version"])')" = '1.1'

          if git ls-remote --exit-code --tags origin refs/tags/v1.1 >/dev/null 2>&1; then
            echo 'v1.1 tag already exists'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v1.1 5b79e538813749b3a1cb2e38eb178cb669436471 -m 'BetterChatGPT v1.1'
            git push origin refs/tags/v1.1
          fi
