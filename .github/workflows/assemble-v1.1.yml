name: Finalize BetterChatGPT v1.1 tag

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-v1.1.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for clean main and create v1.1 tag
        shell: bash
        run: |
          set -euo pipefail
          echo '1bae81ab244260292144481b72f68bf16928dd35ce8427fa78467fe6185720b6  artifacts/BetterChatGPT-chromium-v1.1.zip' | sha256sum -c -

          clean_sha=''
          for _ in $(seq 1 30); do
            git fetch origin main
            candidate="$(git rev-parse origin/main)"
            if ! git cat-file -e "$candidate:.github/workflows/assemble-v1.1.yml" 2>/dev/null; then
              clean_sha="$candidate"
              break
            fi
            sleep 2
          done

          test -n "$clean_sha"
          test "$(git show "$clean_sha:chromium/manifest.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = '1.1'

          if git ls-remote --exit-code --tags origin refs/tags/v1.1 >/dev/null 2>&1; then
            echo 'v1.1 tag already exists'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v1.1 "$clean_sha" -m 'BetterChatGPT v1.1'
            git push origin refs/tags/v1.1
          fi
