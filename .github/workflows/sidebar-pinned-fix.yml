name: Fix duplicate pinned sidebar restoration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sidebar-pinned-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/native-tool-freeze-guard
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Tighten sidebar section control detection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          p = Path('chromium/content.js')
          text = p.read_text(encoding='utf-8')
          old = '  function sectionName(button) {\n    const text = normalizedText(button);\n    for (const name of SECTION_NAMES) {\n      if (text === name || text.startsWith(`${name} `)) return name;\n    }\n    return "";\n  }\n\n  function candidateSectionButtons() {\n    return Array.from(document.querySelectorAll(\'button[aria-expanded], button[data-state], [role="button"][aria-expanded]\'))\n      .filter((node) => SECTION_NAMES.has(sectionName(node)));\n  }\n'
          new = '  function isTransientSidebarLayer(node) {\n    return Boolean(node?.closest?.(\n      \'[role="dialog"], [role="menu"], [role="tooltip"], [data-radix-popper-content-wrapper], [data-floating-ui-portal], [data-headlessui-portal]\',\n    ));\n  }\n\n  function sectionName(button) {\n    if (isTransientSidebarLayer(button)) return "";\n    const text = normalizedText(button);\n    const ariaLabel = String(button?.getAttribute?.("aria-label") || "").replace(/\\s+/g, " ").trim().toLowerCase();\n    for (const name of SECTION_NAMES) {\n      if (text === name || ariaLabel === name) return name;\n    }\n    return "";\n  }\n\n  function candidateSectionButtons() {\n    return Array.from(document.querySelectorAll(\'button[aria-expanded], button[data-state], [role="button"][aria-expanded]\'))\n      .filter((node) => SECTION_NAMES.has(sectionName(node)));\n  }\n'
          text = replace_once(text, old, new, 'sidebar section classifier')
          p.write_text(text, encoding='utf-8')

          p = Path('tools/regression-check.mjs')
          checks = p.read_text(encoding='utf-8')
          anchor = 'requireText(content, \'setManagedStyle(node, "color", "LinkText")\', "user-bubble links stay blue");\n'
          addition = anchor + 'requireText(content, \'function isTransientSidebarLayer(node)\', "sidebar persistence ignores transient native panels");\nrequireText(content, \'if (text === name || ariaLabel === name) return name;\', "sidebar sections require exact labels");\nforbidText(content, \'text.startsWith(`${name} `)\', "sidebar section prefix matching can click native flyouts");\n'
          checks = replace_once(checks, anchor, addition, 'sidebar persistence regression checks')
          p.write_text(checks, encoding='utf-8')

          p = Path('CHANGELOG.md')
          changelog = p.read_text(encoding='utf-8')
          marker = '- Remove the final dead Long-chat optimizer UI remnant (Wake all messages).\n'
          line = '- Prevent sidebar-state persistence from mistaking ChatGPT native Pinned/Projects/Chats flyouts for the actual sidebar section controls, which could leave a duplicate floating Pinned panel open.\n'
          if line not in changelog:
              changelog = replace_once(changelog, marker, line + marker, 'sidebar changelog')
          p.write_text(changelog, encoding='utf-8')
          PY

      - name: Validate Chromium/shared source
        shell: bash
        run: |
          set -euo pipefail
          node tools/regression-check.mjs
          find chromium -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          node -e "JSON.parse(require('fs').readFileSync('chromium/manifest.json', 'utf8'))"
          git diff --check

      - name: Commit and push PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add chromium/content.js tools/regression-check.mjs CHANGELOG.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Avoid duplicate native sidebar flyouts'
          fi
          git push origin HEAD:fix/native-tool-freeze-guard

      - name: Package Chromium test build
        shell: bash
        run: |
          set -euo pipefail
          rm -f BetterChatGPT-chromium-pr1-rehydrate-sidebarfix-pre2-test.zip
          (cd chromium && zip -qr ../BetterChatGPT-chromium-pr1-rehydrate-sidebarfix-pre2-test.zip .)
          unzip -t BetterChatGPT-chromium-pr1-rehydrate-sidebarfix-pre2-test.zip >/dev/null
          sha256sum BetterChatGPT-chromium-pr1-rehydrate-sidebarfix-pre2-test.zip

      - name: Upload Chromium test build
        uses: actions/upload-artifact@v7
        with:
          name: BetterChatGPT-chromium-pr1-rehydrate-sidebarfix-pre2-test
          path: BetterChatGPT-chromium-pr1-rehydrate-sidebarfix-pre2-test.zip
          if-no-files-found: error
