name: Validate rehydration guard test build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refine-pr1-final.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out guard branch
        uses: actions/checkout@v7
        with:
          ref: fix/native-tool-freeze-guard
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Extend flight recorder and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          p = Path('chromium/content.js')
          text = p.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '          guardHeavy: Boolean(guardStatus?.heavy),\n          guardToolSurfaces: Number(guardStatus?.markedToolCount || 0),\n',
              '          guardHeavy: Boolean(guardStatus?.heavy),\n          guardRehydrating: Boolean(guardStatus?.rehydrating),\n          guardRehydrateReason: String(guardStatus?.rehydrateReason || "").slice(0, 40),\n          guardRehydrateRemainingMs: Number(guardStatus?.rehydrateRemainingMs || 0),\n          guardToolSurfaces: Number(guardStatus?.markedToolCount || 0),\n',
              'heartbeat rehydration state',
          )
          p.write_text(text, encoding='utf-8')

          p = Path('chromium/performance-background.js')
          text = p.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    guardHeavy: Boolean(payload.guardHeavy),\n    guardToolSurfaces: Number(payload.guardToolSurfaces || 0),\n',
              '    guardHeavy: Boolean(payload.guardHeavy),\n    guardRehydrating: Boolean(payload.guardRehydrating),\n    guardRehydrateReason: String(payload.guardRehydrateReason || "").slice(0, 40),\n    guardRehydrateRemainingMs: Number(payload.guardRehydrateRemainingMs || 0),\n    guardToolSurfaces: Number(payload.guardToolSurfaces || 0),\n',
              'background rehydration flight recorder',
          )
          p.write_text(text, encoding='utf-8')

          p = Path('tools/regression-check.mjs')
          text = p.read_text(encoding='utf-8')
          anchor = 'requireText(guard, \'const HEAVY_TOOL_THRESHOLD = 4;\', "adaptive guard heavy threshold");\n'
          addition = anchor + '''requireText(guard, 'const REHYDRATE_WINDOW_MS = 3000;', "rehydration prewarm window");
requireText(guard, 'const ROOT_REHYDRATE_ATTR = "data-bcg-native-freeze-guard-rehydrate";', "rehydration root attribute");
requireText(guard, 'enterRehydrate("startup")', "startup prewarm before conversation hydration");
requireText(guard, 'enterRehydrate("hidden", { holdWhileHidden: true })', "hidden tabs stay prewarmed for background tool updates");
requireText(guard, 'globalThis.navigation?.addEventListener?.("navigate"', "SPA navigation prewarm");
requireText(guard, 'document.addEventListener("pointerdown", handlePotentialConversationNavigation, true)', "pre-navigation pointer guard");
requireText(guard, 'generationActive() || isRehydrating() || rehydrateGrace', "rehydration can engage heavy guard before native generating UI appears");
requireText(guard, 'ROOT_REHYDRATE_ATTR}="1"] ${TURN_SELECTOR}', "direct CSS prewarms incoming turns before JS classification");
requireText(content, 'guardRehydrating', "heartbeat records rehydration state");
requireText(perfBackground, 'guardRehydrateReason', "background runway retains rehydration reason");
'''
          text = replace_once(text, anchor, addition, 'rehydration regression assertions')
          p.write_text(text, encoding='utf-8')

          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          old = '- Add an adaptive **Native tool freeze guard** for the renderer hangs seen during tool-heavy generation. It isolates classified tool layout work only while the response is tool-heavy, skips rendering for distant offscreen turns/tool surfaces with a large viewport buffer, protects the newest three turns and interactive/open tool UI, and can be disabled independently while the Native hang recorder stays active. Hang diagnostics now retain the previous 12 heartbeats plus guard containment/skipping state.\n'
          new = '- Add an adaptive **Native tool freeze guard** for the renderer hangs seen during tool-heavy generation. It isolates classified tool layout work, skips distant offscreen turns/tool surfaces, protects the newest three turns and interactive/open tool UI, and now enters a short prewarm mode *before* startup/SPA conversation rehydration and when returning from a hidden tab so an already tool-heavy conversation is contained before its first expensive paint. Hang diagnostics retain the previous 12 heartbeats plus rehydration/containment/skipping state.\n'
          text = replace_once(text, old, new, 'rehydration changelog')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate Chromium/shared source only
        shell: bash
        run: |
          set -euo pipefail
          node tools/regression-check.mjs
          find chromium -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          node --check tools/build-firefox.mjs
          git diff --check

      - name: Commit validated branch changes
        shell: bash
        run: |
          set -euo pipefail
          git add chromium/content.js chromium/performance-background.js tools/regression-check.mjs CHANGELOG.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Record and test conversation rehydration guard state'
          fi
          git push origin HEAD:fix/native-tool-freeze-guard

      - name: Package Chromium test build
        shell: bash
        run: |
          set -euo pipefail
          rm -f BetterChatGPT-chromium-pr1-rehydrate-pre2-test.zip
          (cd chromium && zip -qr ../BetterChatGPT-chromium-pr1-rehydrate-pre2-test.zip .)
          unzip -t BetterChatGPT-chromium-pr1-rehydrate-pre2-test.zip >/dev/null
          sha256sum BetterChatGPT-chromium-pr1-rehydrate-pre2-test.zip

      - name: Upload Chromium test build
        uses: actions/upload-artifact@v7
        with:
          name: BetterChatGPT-chromium-pr1-rehydrate-pre2-test
          path: BetterChatGPT-chromium-pr1-rehydrate-pre2-test.zip
          if-no-files-found: error
