name: Finalize native tool freeze guard refinement

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refine-pr1-final.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/native-tool-freeze-guard
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Preserve effective containment safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          guard_path = Path('chromium/performance-guard.js')
          guard = guard_path.read_text(encoding='utf-8')
          guard = replace_once(
              guard,
              '  const TOOL_SKIP_CLASS = "bcg-native-freeze-guard-tool-skip";\n',
              '  const TOOL_SKIP_CLASS = "bcg-native-freeze-guard-tool-skip";\n  const TOOL_CONTAIN_CLASS = "bcg-native-freeze-guard-tool-contain";\n',
              'tool containment class',
          )
          guard = replace_once(
              guard,
              '      html[${ROOT_ACTIVE_ATTR}="1"][${ROOT_HEAVY_ATTR}="1"] .${TOOL_SKIP_CLASS} {\n        content-visibility: auto;\n        contain-intrinsic-size: auto 180px;\n      }\n',
              '      html[${ROOT_ACTIVE_ATTR}="1"][${ROOT_HEAVY_ATTR}="1"] .${TOOL_CONTAIN_CLASS} {\n        contain: layout;\n      }\n\n      html[${ROOT_ACTIVE_ATTR}="1"][${ROOT_HEAVY_ATTR}="1"] .${TOOL_SKIP_CLASS} {\n        content-visibility: auto;\n        contain-intrinsic-size: auto 180px;\n      }\n',
              'balanced tool containment CSS',
          )
          guard = replace_once(
              guard,
              '  let skippedToolCount = 0;\n  let skippedTurnCount = 0;\n',
              '  let containedToolCount = 0;\n  let skippedToolCount = 0;\n  let skippedTurnCount = 0;\n',
              'contained tool state',
          )
          guard = replace_once(
              guard,
              '    tool.classList?.remove(TOOL_SKIP_CLASS);\n',
              '    tool.classList?.remove(TOOL_SKIP_CLASS);\n    tool.classList?.remove(TOOL_CONTAIN_CLASS);\n',
              'untrack tool containment cleanup',
          )
          guard = replace_once(
              guard,
              '    let nextSkippedTurns = 0;\n    let nextSkippedTools = 0;\n',
              '    let nextSkippedTurns = 0;\n    let nextContainedTools = 0;\n    let nextSkippedTools = 0;\n',
              'policy counters',
          )
          old_tool_policy = '''      const shouldSkip = active
        && heavy
        && nearViewport.get(tool) === false
        && !isInteractionProtected(tool);
      tool.classList.toggle(TOOL_SKIP_CLASS, shouldSkip);
      if (shouldSkip) nextSkippedTools += 1;
'''
          new_tool_policy = '''      const interactionProtected = active && heavy && isInteractionProtected(tool);
      const shouldContain = active && heavy && !interactionProtected;
      const shouldSkip = shouldContain && nearViewport.get(tool) === false;
      tool.classList.toggle(TOOL_CONTAIN_CLASS, shouldContain);
      tool.classList.toggle(TOOL_SKIP_CLASS, shouldSkip);
      if (shouldContain) nextContainedTools += 1;
      if (shouldSkip) nextSkippedTools += 1;
'''
          guard = replace_once(guard, old_tool_policy, new_tool_policy, 'balanced tool policy')
          guard = replace_once(
              guard,
              '    skippedTurnCount = nextSkippedTurns;\n    skippedToolCount = nextSkippedTools;\n',
              '    skippedTurnCount = nextSkippedTurns;\n    containedToolCount = nextContainedTools;\n    skippedToolCount = nextSkippedTools;\n',
              'policy counter assignment',
          )
          old_refresh = '''    if (heavy !== nextHeavy) {
      heavy = nextHeavy;
      if (heavy) document.documentElement.setAttribute(ROOT_HEAVY_ATTR, "1");
      else document.documentElement.removeAttribute(ROOT_HEAVY_ATTR);
      BCG.recordTrace?.(heavy ? "native-tool-freeze-guard-heavy" : "native-tool-freeze-guard-normal", {
        toolSurfaces: markedToolCount,
        toolSurfaceLabels: heavy ? toolSurfaceLabels() : [],
        skippedTools: skippedToolCount,
        skippedTurns: skippedTurnCount,
        generating: generationActive(),
      });
    }
    applyVisibilityPolicy();
'''
          new_refresh = '''    const heavyChanged = heavy !== nextHeavy;
    if (heavyChanged) {
      heavy = nextHeavy;
      if (heavy) document.documentElement.setAttribute(ROOT_HEAVY_ATTR, "1");
      else document.documentElement.removeAttribute(ROOT_HEAVY_ATTR);
    }
    applyVisibilityPolicy();
    if (heavyChanged) {
      BCG.recordTrace?.(heavy ? "native-tool-freeze-guard-heavy" : "native-tool-freeze-guard-normal", {
        toolSurfaces: markedToolCount,
        toolSurfaceLabels: heavy ? toolSurfaceLabels() : [],
        containedTools: containedToolCount,
        skippedTools: skippedToolCount,
        skippedTurns: skippedTurnCount,
        generating: generationActive(),
      });
    }
'''
          guard = replace_once(guard, old_refresh, new_refresh, 'post-policy heavy trace')
          guard = replace_once(
              guard,
              '    markedToolCount = 0;\n    skippedToolCount = 0;\n',
              '    markedToolCount = 0;\n    containedToolCount = 0;\n    skippedToolCount = 0;\n',
              'stop counter cleanup',
          )
          guard = replace_once(
              guard,
              '    for (const tool of trackedTools) tool.classList?.remove(TOOL_SKIP_CLASS);\n',
              '    for (const tool of trackedTools) {\n      tool.classList?.remove(TOOL_SKIP_CLASS);\n      tool.classList?.remove(TOOL_CONTAIN_CLASS);\n    }\n',
              'stop tool class cleanup',
          )
          guard = replace_once(
              guard,
              '        markedToolCount: trackedTools.size,\n        skippedToolCount,\n',
              '        markedToolCount: trackedTools.size,\n        containedToolCount,\n        skippedToolCount,\n',
              'guard status containment count',
          )
          guard_path.write_text(guard, encoding='utf-8')

          content_path = Path('chromium/content.js')
          content = content_path.read_text(encoding='utf-8')
          content = replace_once(
              content,
              '          guardToolSurfaces: Number(guardStatus?.markedToolCount || 0),\n          guardSkippedTools: Number(guardStatus?.skippedToolCount || 0),\n',
              '          guardToolSurfaces: Number(guardStatus?.markedToolCount || 0),\n          guardContainedTools: Number(guardStatus?.containedToolCount || 0),\n          guardSkippedTools: Number(guardStatus?.skippedToolCount || 0),\n',
              'heartbeat containment metric',
          )
          content = content.replace(
              'Reduce renderer work from offscreen conversation/tool surfaces only during tool-heavy generation. Disable this independently if a native tool UI behaves incorrectly; the hang recorder can remain enabled.',
              'During tool-heavy generation, isolate tool layout work and skip offscreen conversation/tool rendering while protecting the active tail and interactive tool surfaces. Disable this independently if a native tool UI behaves incorrectly; the hang recorder can remain enabled.',
          )
          content_path.write_text(content, encoding='utf-8')

          bg_path = Path('chromium/performance-background.js')
          bg = bg_path.read_text(encoding='utf-8')
          bg = replace_once(
              bg,
              '    guardToolSurfaces: Number(payload.guardToolSurfaces || 0),\n    guardSkippedTools: Number(payload.guardSkippedTools || 0),\n',
              '    guardToolSurfaces: Number(payload.guardToolSurfaces || 0),\n    guardContainedTools: Number(payload.guardContainedTools || 0),\n    guardSkippedTools: Number(payload.guardSkippedTools || 0),\n',
              'background containment metric',
          )
          bg_path.write_text(bg, encoding='utf-8')

          regression_path = Path('tools/regression-check.mjs')
          checks = regression_path.read_text(encoding='utf-8')
          anchor = 'forbidText(guard, \'contain: layout style;\', "broad tool layout containment");\n'
          addition = anchor + '''requireText(guard, 'contain: layout;', "tool-heavy layout containment is retained without style containment");\nrequireText(guard, 'const shouldContain = active && heavy && !interactionProtected;', "tool containment protects interactive surfaces");\nrequireText(content, 'guardContainedTools', "heartbeat records contained tool count");\nrequireText(perfBackground, 'guardContainedTools', "background flight recorder retains contained tool count");\n'''
          checks = replace_once(checks, anchor, addition, 'balanced containment regression checks')
          regression_path.write_text(checks, encoding='utf-8')
          PY

      - name: Validate balanced guard
        shell: bash
        run: |
          set -euo pipefail
          node tools/regression-check.mjs
          find chromium -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          node --check tools/build-firefox.mjs
          node tools/build-firefox.mjs
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('chromium/manifest.json', 'utf8'));
          const f = JSON.parse(fs.readFileSync('build/firefox-src/manifest.json', 'utf8'));
          if (c.version !== '1.1.2' || c.version_name !== '1.1-pre.2') throw new Error('pre.2 version metadata was lost');
          if (f.version !== c.version) throw new Error('Firefox version mismatch');
          if (!c.content_scripts.some((entry) => entry.js?.includes('performance-guard.js'))) throw new Error('Chromium guard missing');
          if (!f.content_scripts.some((entry) => entry.js?.includes('performance-guard.js'))) throw new Error('Firefox guard missing');
          NODE
          npx --yes web-ext@10 lint --source-dir build/firefox-src
          git diff --check

      - name: Commit and push balanced guard
        shell: bash
        run: |
          set -euo pipefail
          git add chromium/content.js chromium/performance-background.js chromium/performance-guard.js tools/regression-check.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Balance native tool freeze mitigation and UI safety'
          fi
          git push origin HEAD:fix/native-tool-freeze-guard
