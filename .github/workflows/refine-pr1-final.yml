name: Finalize native tool freeze guard refinement

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refine-pr1-final.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/native-tool-freeze-guard
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Harden reviewed guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          guard_path = Path('chromium/performance-guard.js')
          guard = guard_path.read_text(encoding='utf-8')
          guard = replace_once(
              guard,
              '    if (element.tagName === "IFRAME") return true;\n    if (!(element instanceof HTMLElement)) return false;\n    if (NON_SURFACE_TAGS.has(element.tagName)) return false;\n',
              '    if (!(element instanceof HTMLElement)) return false;\n    if (!element.closest(TURN_SELECTOR)) return false;\n    if (element.tagName === "IFRAME") return true;\n    if (NON_SURFACE_TAGS.has(element.tagName)) return false;\n',
              'conversation-scoped tool classification',
          )
          guard = replace_once(
              guard,
              '      document.documentElement.toggleAttribute(ROOT_HEAVY_ATTR, heavy);\n',
              '      if (heavy) document.documentElement.setAttribute(ROOT_HEAVY_ATTR, "1");\n      else document.documentElement.removeAttribute(ROOT_HEAVY_ATTR);\n',
              'heavy-mode CSS attribute value',
          )
          guard = replace_once(
              guard,
              '    heavy = false;\n    markedToolCount = trackedTools.size;\n    skippedToolCount = 0;\n    skippedTurnCount = 0;\n    document.documentElement.removeAttribute(ROOT_ACTIVE_ATTR);\n    document.documentElement.removeAttribute(ROOT_HEAVY_ATTR);\n    for (const turn of trackedTurns) turn.classList?.remove(TURN_SKIP_CLASS);\n    for (const tool of trackedTools) tool.classList?.remove(TOOL_SKIP_CLASS);\n    BCG.recordTrace?.("native-tool-freeze-guard-stopped", {});\n',
              '    heavy = false;\n    markedToolCount = 0;\n    skippedToolCount = 0;\n    skippedTurnCount = 0;\n    document.documentElement.removeAttribute(ROOT_ACTIVE_ATTR);\n    document.documentElement.removeAttribute(ROOT_HEAVY_ATTR);\n    for (const turn of trackedTurns) turn.classList?.remove(TURN_SKIP_CLASS);\n    for (const tool of trackedTools) tool.classList?.remove(TOOL_SKIP_CLASS);\n    trackedTurns.clear();\n    turnOrder.length = 0;\n    trackedTools.clear();\n    BCG.recordTrace?.("native-tool-freeze-guard-stopped", {});\n',
              'guard restart lifecycle cleanup',
          )
          guard_path.write_text(guard, encoding='utf-8')

          regression_path = Path('tools/regression-check.mjs')
          checks = regression_path.read_text(encoding='utf-8')
          anchor = 'requireText(guard, \'const HEAVY_TOOL_THRESHOLD = 4;\', "adaptive guard heavy threshold");\n'
          addition = anchor + '''requireText(guard, 'setAttribute(ROOT_HEAVY_ATTR, "1")', "heavy-mode CSS attribute value");\nforbidText(guard, 'toggleAttribute(ROOT_HEAVY_ATTR, heavy)', "boolean heavy attribute cannot satisfy value selector");\nrequireText(guard, '!element.closest(TURN_SELECTOR)', "tool classification stays inside conversation turns");\nrequireText(guard, 'trackedTools.clear()', "guard restart clears stale tracked tools");\nrequireText(guard, 'turnOrder.length = 0', "guard restart clears stale turn order");\n'''
          checks = replace_once(checks, anchor, addition, 'reviewed guard regression checks')
          regression_path.write_text(checks, encoding='utf-8')
          PY

      - name: Validate reviewed PR tree
        shell: bash
        run: |
          set -euo pipefail
          node tools/regression-check.mjs
          find chromium -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          node --check tools/build-firefox.mjs
          node tools/build-firefox.mjs
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('chromium/manifest.json', 'utf8'));
          const f = JSON.parse(fs.readFileSync('build/firefox-src/manifest.json', 'utf8'));
          if (c.version !== '1.1.2' || c.version_name !== '1.1-pre.2') throw new Error('pre.2 version metadata was lost');
          if (f.version !== c.version) throw new Error('Firefox version mismatch');
          if (!c.content_scripts.some((entry) => entry.js?.includes('performance-guard.js'))) throw new Error('Chromium guard missing');
          if (!f.content_scripts.some((entry) => entry.js?.includes('performance-guard.js'))) throw new Error('Firefox guard missing');
          NODE
          npx --yes web-ext@10 lint --source-dir build/firefox-src
          git diff --check

      - name: Commit and push reviewed guard
        shell: bash
        run: |
          set -euo pipefail
          git add chromium/performance-guard.js tools/regression-check.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Harden adaptive native tool freeze guard'
          fi
          git push origin HEAD:fix/native-tool-freeze-guard
