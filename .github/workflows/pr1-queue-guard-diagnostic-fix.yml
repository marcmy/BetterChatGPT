name: Fix PR1 queue semantics and guard detection

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pr1-queue-guard-diagnostic-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/native-tool-freeze-guard
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Apply patch helper from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git show origin/main:tools/_pr1_patch_queue_guard.py > /tmp/pr1-patch.py
          python3 /tmp/pr1-patch.py

      - name: Validate Chromium/shared source
        shell: bash
        run: |
          set -euo pipefail
          node tools/regression-check.mjs
          find chromium -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          node -e "JSON.parse(require('fs').readFileSync('chromium/manifest.json', 'utf8'))"
          git diff --check

      - name: Commit and push PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add chromium/content.js chromium/performance-guard.js chromium/performance-background.js tools/regression-check.mjs CHANGELOG.md
          git diff --cached --check
          git commit -m 'Make queued send attachment-only and align freeze guard detection'
          git push origin HEAD:fix/native-tool-freeze-guard

      - name: Package Chromium test build
        shell: bash
        run: |
          set -euo pipefail
          rm -f BetterChatGPT-chromium-pr1-upload-queue-guard-pre2-test.zip
          (cd chromium && zip -qr ../BetterChatGPT-chromium-pr1-upload-queue-guard-pre2-test.zip .)
          unzip -t BetterChatGPT-chromium-pr1-upload-queue-guard-pre2-test.zip >/dev/null
          sha256sum BetterChatGPT-chromium-pr1-upload-queue-guard-pre2-test.zip

      - name: Upload Chromium test build
        uses: actions/upload-artifact@v7
        with:
          name: BetterChatGPT-chromium-pr1-upload-queue-guard-pre2-test
          path: BetterChatGPT-chromium-pr1-upload-queue-guard-pre2-test.zip
          if-no-files-found: error
