name: Disable unsafe Pinned section restoration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sidebar-pinned-disable.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/native-tool-freeze-guard
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Stop managing native Pinned state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          p = Path('chromium/content.js')
          text = p.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '  const SECTION_NAMES = new Set(["pinned", "projects", "chats"]);\n',
              '  const SECTION_NAMES = new Set(["projects", "chats"]);\n',
              'managed sidebar sections',
          )
          text = replace_once(
              text,
              'setting("navigation.persistSidebarSections", "Remember sidebar sections", "checkbox", "Restore whether Pinned, Projects, and Chats were expanded or collapsed.")',
              'setting("navigation.persistSidebarSections", "Remember sidebar sections", "checkbox", "Restore whether Projects and Chats were expanded or collapsed. Pinned is left to ChatGPT because its native control can open a floating panel in some layouts.")',
              'sidebar settings description',
          )
          p.write_text(text, encoding='utf-8')

          p = Path('tools/regression-check.mjs')
          checks = p.read_text(encoding='utf-8')
          anchor = 'requireText(content, \'function isTransientSidebarLayer(node)\', "sidebar persistence ignores transient native panels");\n'
          addition = anchor + 'requireText(content, \'const SECTION_NAMES = new Set(["projects", "chats"]);\', "Pinned is not programmatically restored");\nforbidText(content, \'const SECTION_NAMES = new Set(["pinned", "projects", "chats"]);\', "Pinned restoration can spawn native floating panel");\n'
          checks = replace_once(checks, anchor, addition, 'Pinned persistence regression checks')
          p.write_text(checks, encoding='utf-8')

          p = Path('CHANGELOG.md')
          changelog = p.read_text(encoding='utf-8')
          old = '- Prevent sidebar-state persistence from mistaking ChatGPT native Pinned/Projects/Chats flyouts for the actual sidebar section controls, which could leave a duplicate floating Pinned panel open.\n'
          new = '- Stop programmatically restoring ChatGPT\'s **Pinned** section state entirely after the native Pinned control began opening a floating panel in some sidebar layouts; Projects and Chats persistence remain enabled.\n'
          changelog = replace_once(changelog, old, new, 'Pinned changelog')
          p.write_text(changelog, encoding='utf-8')
          PY

      - name: Validate Chromium/shared source
        shell: bash
        run: |
          set -euo pipefail
          node tools/regression-check.mjs
          find chromium -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          node -e "JSON.parse(require('fs').readFileSync('chromium/manifest.json', 'utf8'))"
          git diff --check

      - name: Commit and push PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add chromium/content.js tools/regression-check.mjs CHANGELOG.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Stop restoring native Pinned section state'
          fi
          git push origin HEAD:fix/native-tool-freeze-guard

      - name: Package Chromium test build
        shell: bash
        run: |
          set -euo pipefail
          rm -f BetterChatGPT-chromium-pr1-rehydrate-no-pinned-pre2-test.zip
          (cd chromium && zip -qr ../BetterChatGPT-chromium-pr1-rehydrate-no-pinned-pre2-test.zip .)
          unzip -t BetterChatGPT-chromium-pr1-rehydrate-no-pinned-pre2-test.zip >/dev/null
          sha256sum BetterChatGPT-chromium-pr1-rehydrate-no-pinned-pre2-test.zip

      - name: Upload Chromium test build
        uses: actions/upload-artifact@v7
        with:
          name: BetterChatGPT-chromium-pr1-rehydrate-no-pinned-pre2-test
          path: BetterChatGPT-chromium-pr1-rehydrate-no-pinned-pre2-test.zip
          if-no-files-found: error
