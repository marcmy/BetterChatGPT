name: BetterChatGPT Firefox

on:
  pull_request:
    paths:
      - "chromium/**"
      - "tools/build-firefox.mjs"
      - ".github/workflows/firefox.yml"
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the Firefox XPI with Mozilla AMO"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: betterchatgpt-firefox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firefox:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate Chromium-source JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find chromium -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Stage Firefox build
        shell: bash
        run: node tools/build-firefox.mjs

      - name: Validate Firefox manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('build/firefox-src/manifest.json', 'utf8'));
          if (m.version !== '1.1') throw new Error(`Expected v1.1, got ${m.version}`);
          if (m.background?.service_worker) throw new Error('Firefox manifest still contains background.service_worker');
          if (!Array.isArray(m.background?.scripts) || !m.background.scripts.includes('performance-background.js')) {
            throw new Error('Firefox background script fallback missing');
          }
          if (m.browser_specific_settings?.gecko?.id !== 'better-chatgpt@marcmy.github.io') {
            throw new Error('Firefox Gecko ID mismatch');
          }
          if (m.browser_specific_settings?.gecko?.data_collection_permissions?.required?.[0] !== 'none') {
            throw new Error('Firefox data collection declaration mismatch');
          }
          NODE

      - name: Lint and package Firefox extension
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/firefox
          mkdir -p build/firefox
          npx --yes web-ext@10 lint --source-dir build/firefox-src
          npx --yes web-ext@10 build \
            --source-dir build/firefox-src \
            --artifacts-dir build/firefox \
            --overwrite-dest
          unsigned=$(find build/firefox -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$unsigned"
          cp "$unsigned" build/firefox/BetterChatGPT-firefox-v1.1-unsigned.zip

      - name: Sign Firefox XPI with Mozilla
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AMO_JWT_ISSUER:-}" ] || [ -z "${AMO_JWT_SECRET:-}" ]; then
            echo 'Missing AMO_JWT_ISSUER and/or AMO_JWT_SECRET repository secrets.' >&2
            exit 1
          fi

          npx --yes web-ext@10 sign \
            --source-dir build/firefox-src \
            --artifacts-dir build/firefox \
            --channel unlisted \
            --approval-timeout 3600000 \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

          signed=$(find build/firefox -maxdepth 1 -type f -name '*.xpi' | sort | tail -n 1)
          test -n "$signed"
          cp "$signed" build/firefox/BetterChatGPT-firefox-v1.1.xpi

      - name: Upload Firefox artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BetterChatGPT-Firefox-1.1
          path: build/firefox/*
          if-no-files-found: error
