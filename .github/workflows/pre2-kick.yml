name: Fix and rerun BetterChatGPT pre.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pre2-kick.yml"

permissions:
  contents: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fix fallback wording and retrigger publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('chromium/content.js')
          text = p.read_text(encoding='utf-8')
          old = 'notify(reloadRequired ? "Saved. Reload ChatGPT to apply every change." : "Saved.");'
          new = 'notify(reloadRequired ? "Saved. Reload ChatGPT to apply this structural change." : "Saved.");'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one generic reload fallback, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          q = Path('.github/workflows/pre2-release.yml')
          workflow = q.read_text(encoding='utf-8')
          q.write_text(workflow + '\n# retry after live-setting fallback cleanup\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pre2-kick.yml
          git add chromium/content.js .github/workflows/pre2-release.yml
          git commit -m 'Clarify structural reload fallback before pre.2'
          git push origin HEAD:main
