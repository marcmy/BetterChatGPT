name: Package refined PR1 guard test build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pr1-test-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact refined PR head
        uses: actions/checkout@v7
        with:
          ref: 063b36f6c92d7e9377165a3422716b6b06844ca9

      - name: Validate exact test head
        shell: bash
        run: |
          set -euo pipefail
          node tools/regression-check.mjs
          find chromium -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('chromium/manifest.json', 'utf8'));
          if (m.version !== '1.1.2' || m.version_name !== '1.1-pre.2') throw new Error('unexpected test build version');
          if (!m.content_scripts.some((entry) => entry.js?.includes('performance-guard.js'))) throw new Error('guard missing from test package');
          NODE

      - name: Package Chromium test build
        shell: bash
        run: |
          set -euo pipefail
          rm -f BetterChatGPT-chromium-pr1-refined-pre2-test.zip
          (cd chromium && zip -qr ../BetterChatGPT-chromium-pr1-refined-pre2-test.zip .)
          unzip -t BetterChatGPT-chromium-pr1-refined-pre2-test.zip >/dev/null
          sha256sum BetterChatGPT-chromium-pr1-refined-pre2-test.zip

      - name: Upload test build
        uses: actions/upload-artifact@v7
        with:
          name: BetterChatGPT-chromium-pr1-refined-pre2-test
          path: BetterChatGPT-chromium-pr1-refined-pre2-test.zip
          if-no-files-found: error
