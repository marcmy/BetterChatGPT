name: BetterChatGPT Source Validation

on:
  push:
    branches:
      - main
    paths:
      - "chromium/**"
      - "tools/regression-check.mjs"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "chromium/**"
      - "tools/regression-check.mjs"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: betterchatgpt-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate shared source
        shell: bash
        run: |
          set -euo pipefail
          node tools/regression-check.mjs
          find chromium -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          node -e "JSON.parse(require('fs').readFileSync('chromium/manifest.json', 'utf8'))"
          git diff --check
