name: Finalize BetterChatGPT v1.1 pre.2

on:
  push:
    branches: [main]
    paths: [".github/workflows/pre2-finalize.yml"]

permissions:
  contents: write

env:
  AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
  AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Recreate validated pre.2 source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/firefox.yml /tmp/firefox-dynamic.yml
          git show v1.1-pre.1:.github/workflows/firefox.yml > .github/workflows/firefox.yml
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          p = Path('chromium/content.js')
          s = p.read_text(encoding='utf-8')
          old = 'notify(reloadRequired ? "Saved. Reload ChatGPT to apply every change." : "Saved.");'
          new = 'notify(reloadRequired ? "Saved. Reload ChatGPT to apply this structural change." : "Saved.");'
          if s.count(old) != 1:
              raise RuntimeError(f'fallback count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          w = Path('.github/workflows/pre2-release.yml').read_text(encoding='utf-8')
          a = w.index('      - name: Apply pre.2 fixes\n')
          b = w.index('        run: |\n', a) + len('        run: |\n')
          e = w.index('\n      - name: Validate runtime and regression guards', b)
          Path('/tmp/apply-pre2.sh').write_text(textwrap.dedent(w[b:e]), encoding='utf-8')
          PY
          bash /tmp/apply-pre2.sh
          cp /tmp/firefox-dynamic.yml .github/workflows/firefox.yml
          git diff --exit-code -- .github/workflows/firefox.yml
          node tools/regression-check.mjs
          find chromium -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
          node tools/build-firefox.mjs
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('chromium/manifest.json','utf8'));
          const f=JSON.parse(fs.readFileSync('build/firefox-src/manifest.json','utf8'));
          if(c.version!=='1.1.2'||c.version_name!=='1.1-pre.2') throw new Error('Chromium version mismatch');
          if(f.version!=='1.1.2'||('version_name' in f)) throw new Error('Firefox version mismatch');
          if(f.browser_specific_settings?.gecko?.strict_min_version!=='142.0') throw new Error('Firefox min mismatch');
          NODE

      - name: Download the already-signed Firefox 1.1.2 from AMO
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, hmac, json, os, time, uuid, urllib.request, urllib.error
          from pathlib import Path
          issuer=os.environ['AMO_JWT_ISSUER']; secret=os.environ['AMO_JWT_SECRET'].encode()
          b64=lambda b: base64.urlsafe_b64encode(b).rstrip(b'=').decode()
          now=int(time.time())
          head={'alg':'HS256','typ':'JWT'}
          body={'iss':issuer,'jti':str(uuid.uuid4()),'iat':now,'exp':now+90}
          raw=f"{b64(json.dumps(head,separators=(',',':')).encode())}.{b64(json.dumps(body,separators=(',',':')).encode())}"
          token=f"{raw}.{b64(hmac.new(secret,raw.encode(),hashlib.sha256).digest())}"
          headers={'Authorization':f'JWT {token}','User-Agent':'BetterChatGPT-pre2-finalizer'}
          base='https://addons.mozilla.org/api/v5/addons/addon/3062261/versions/'
          def load(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r: return json.load(r)
          try:
              version=load(base+'v1.1.2/')
          except urllib.error.HTTPError as exc:
              if exc.code!=404: raise
              listing=load(base+'?filter=all_with_unlisted&page_size=50')
              matches=[x for x in listing.get('results',[]) if str(x.get('version'))=='1.1.2']
              if not matches: raise RuntimeError('AMO 1.1.2 not found')
              version=matches[0]
          info=version.get('file') or {}
          url=info.get('url')
          if not url: raise RuntimeError('AMO file URL missing')
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'BetterChatGPT-pre2-finalizer'}),timeout=120) as r: data=r.read()
          digest=hashlib.sha256(data).hexdigest(); expected=str(info.get('hash') or '')
          if expected.startswith('sha256:') and digest.lower()!=expected.split(':',1)[1].lower():
              raise RuntimeError(f'AMO hash mismatch {digest} != {expected}')
          Path('/tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi').write_bytes(data)
          print(f"AMO Firefox {version.get('version')} recovered: {len(data)} bytes sha256:{digest}")
          PY
          unzip -t /tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi >/dev/null
          unzip -l /tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi | grep -q 'META-INF/mozilla.rsa'

      - name: Package, checksum, and update docs
        shell: bash
        run: |
          set -euo pipefail
          (cd chromium && zip -qr /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip .)
          unzip -t /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip >/dev/null
          chromium_sha=$(sha256sum /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip|awk '{print $1}')
          firefox_sha=$(sha256sum /tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi|awk '{print $1}')
          export chromium_sha firefox_sha
          rm -f artifacts/BetterChatGPT-chromium-v1.1.zip artifacts/BetterChatGPT-firefox-v1.1.xpi
          cp /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip artifacts/
          cp /tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi artifacts/
          printf '%s  %s\n%s  %s\n' "$chromium_sha" BetterChatGPT-chromium-v1.1-pre.2.zip "$firefox_sha" BetterChatGPT-firefox-v1.1-pre.2.xpi > artifacts/SHA256SUMS.txt
          python3 <<'PY'
          from pathlib import Path
          import os,re
          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('## v1.1 highlights','## v1.1 pre-release highlights')
          s=re.sub(r'\*\*\[Download BetterChatGPT v1\.1 for Chromium/Edge\]\([^\n]+\)\*\*\n\nSHA-256: `[^`]+`',f'**[Download BetterChatGPT v1.1 pre.2 for Chromium/Edge](https://github.com/marcmy/BetterChatGPT/raw/main/artifacts/BetterChatGPT-chromium-v1.1-pre.2.zip)**\n\nSHA-256: `{os.environ["chromium_sha"]}`',s)
          s=re.sub(r'\*\*\[Download Mozilla-signed BetterChatGPT v1\.1 for Firefox\]\([^\n]+\)\*\*\n\nSHA-256: `[^`]+`',f'**[Download Mozilla-signed BetterChatGPT v1.1 pre.2 for Firefox](https://github.com/marcmy/BetterChatGPT/raw/main/artifacts/BetterChatGPT-firefox-v1.1-pre.2.xpi)**\n\nSHA-256: `{os.environ["firefox_sha"]}`',s)
          s=s.replace('Most layout/appearance changes apply immediately. Structural behavior is safest to test after **Reload ChatGPT**.','All regular settings apply immediately; **Reload ChatGPT** remains available only as a manual troubleshooting action.')
          s=s.replace('produces `BetterChatGPT-firefox-v1.1.xpi` as an Actions artifact.','produces the current versioned signed XPI as an Actions artifact.')
          p.write_text(s,encoding='utf-8')
          PY
          node tools/regression-check.mjs
          (cd artifacts && sha256sum -c SHA256SUMS.txt)
          git diff --check -- chromium tools README.md CHANGELOG.md AMO_REVIEW_NOTES.md artifacts

      - name: Commit ordinary pre.2 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chromium tools README.md CHANGELOG.md AMO_REVIEW_NOTES.md artifacts
          git diff --cached --check
          git commit -m 'Prepare BetterChatGPT v1.1 pre.2'
          git push origin HEAD:main
