name: Refine native tool freeze guard PR

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refine-pr1.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/native-tool-freeze-guard
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Merge current pre.2 tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Refine guard and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          content_path = Path('chromium/content.js')
          c = content_path.read_text(encoding='utf-8')

          c = replace_once(
              c,
              '      performanceHangRecorder: true,\n',
              '      performanceHangRecorder: true,\n      nativeToolFreezeGuard: true,\n',
              'guard default',
          )
          c = replace_once(
              c,
              '    merged.advanced.performanceHangRecorder = Boolean(merged.advanced.performanceHangRecorder);\n',
              '    merged.advanced.performanceHangRecorder = Boolean(merged.advanced.performanceHangRecorder);\n    merged.advanced.nativeToolFreezeGuard = Boolean(merged.advanced.nativeToolFreezeGuard);\n',
              'guard validation',
          )
          c = replace_once(
              c,
              '            setting("advanced.performanceHangRecorder", "Native hang recorder", "checkbox", "Record low-overhead timing, memory, DOM-count, and long-frame diagnostics for ChatGPT freezes. Stays active when Master enable is off so the native UI can be tested without Better ChatGPT features."),\n            setting("advanced.debug", "Debug logging", "checkbox", "Record additional console and bridge diagnostics."),',
              '            setting("advanced.performanceHangRecorder", "Native hang recorder", "checkbox", "Record low-overhead timing, memory, DOM-count, and long-frame diagnostics for ChatGPT freezes. Stays active when Master enable is off so the native UI can be tested without Better ChatGPT features."),\n            setting("advanced.nativeToolFreezeGuard", "Native tool freeze guard", "checkbox", "Reduce renderer work from offscreen conversation/tool surfaces only during tool-heavy generation. Disable this independently if a native tool UI behaves incorrectly; the hang recorder can remain enabled."),\n            setting("advanced.debug", "Debug logging", "checkbox", "Record additional console and bridge diagnostics."),',
              'guard settings field',
          )
          c = replace_once(
              c,
              '      performanceHangRecorder: Boolean(settings.advanced.performanceHangRecorder),\n',
              '      performanceHangRecorder: Boolean(settings.advanced.performanceHangRecorder),\n      nativeToolFreezeGuard: Boolean(settings.advanced.nativeToolFreezeGuard),\n',
              'guard status',
          )
          c = replace_once(
              c,
              '      performance: apiObject.performanceDiagnostics?.getReport?.() || null,\n      recentErrors: clone(diagnostics),',
              '      performance: apiObject.performanceDiagnostics?.getReport?.() || null,\n      nativeToolFreezeGuard: apiObject.nativeToolFreezeGuard?.status?.() || null,\n      recentErrors: clone(diagnostics),',
              'guard diagnostics',
          )
          c = replace_once(
              c,
              '  function sendHeartbeat(metrics) {\n    const api = extensionApi();',
              '  function sendHeartbeat(metrics) {\n    const guardStatus = BCG.nativeToolFreezeGuard?.status?.() || null;\n    const api = extensionApi();',
              'heartbeat guard status prelude',
          )
          c = replace_once(
              c,
              '          path: safePath(),\n          ...metrics,\n',
              '          path: safePath(),\n          ...metrics,\n          guardActive: Boolean(guardStatus?.active),\n          guardHeavy: Boolean(guardStatus?.heavy),\n          guardToolSurfaces: Number(guardStatus?.markedToolCount || 0),\n          guardSkippedTools: Number(guardStatus?.skippedToolCount || 0),\n          guardSkippedTurns: Number(guardStatus?.skippedTurnCount || 0),\n',
              'heartbeat guard metrics',
          )
          c = replace_once(
              c,
              '        sendResponse({ ok: true, status: getStatus() });\n        setTimeout(() => location.reload(), 120);\n      } else if (command === "bcg:toggle-tab") {',
              '        sendResponse({ ok: true, status: getStatus() });\n      } else if (command === "bcg:toggle-tab") {',
              'popup master toggle live',
          )
          content_path.write_text(c, encoding='utf-8')

          bg = '''"use strict";\n\nconst api = typeof browser !== "undefined" ? browser : chrome;\nconst STORAGE_KEY = "better-chatgpt:perf-diagnostics-v1";\nconst HANG_KEY = `${STORAGE_KEY}:hangs`;\nconst HANG_AFTER_MS = 4500;\nconst MAX_HANGS = 8;\nconst MAX_HEARTBEATS = 12;\nconst watches = new Map();\n\nfunction watchKey(sender, payload) {\n  return `${sender.tab?.id ?? "tab"}:${String(payload?.sessionId || "session")}`;\n}\n\nasync function storeHang(hang) {\n  try {\n    const stored = await api.storage.local.get(HANG_KEY);\n    const hangs = Array.isArray(stored?.[HANG_KEY]) ? stored[HANG_KEY] : [];\n    const existing = hangs.findIndex((item) => item?.watchKey === hang.watchKey && !item?.recoveredAt);\n    if (existing >= 0) hangs[existing] = { ...hang };\n    else hangs.push(hang);\n    if (hangs.length > MAX_HANGS) hangs.splice(0, hangs.length - MAX_HANGS);\n    await api.storage.local.set({ [HANG_KEY]: hangs });\n  } catch {\n    // The watchdog must never make the extension less reliable.\n  }\n}\n\nasync function markRecovered(key, recoveredAt, gapMs) {\n  try {\n    const stored = await api.storage.local.get(HANG_KEY);\n    const hangs = Array.isArray(stored?.[HANG_KEY]) ? stored[HANG_KEY] : [];\n    const index = [...hangs].map((item) => item?.watchKey).lastIndexOf(key);\n    if (index < 0 || hangs[index]?.recoveredAt) return;\n    hangs[index] = { ...hangs[index], recoveredAt, observedGapMs: gapMs };\n    await api.storage.local.set({ [HANG_KEY]: hangs });\n  } catch {\n    // Best effort.\n  }\n}\n\nfunction heartbeatSnapshot(payload, now) {\n  return {\n    at: new Date(Number(payload.at || now)).toISOString(),\n    path: String(payload.path || "/").slice(0, 180),\n    visibility: String(payload.visibility || "").slice(0, 20),\n    generating: Boolean(payload.generating),\n    toolSurfaces: Number(payload.toolSurfaces || 0),\n    heapUsedMb: Number(payload.heapUsedMb || 0),\n    heapLimitMb: Number(payload.heapLimitMb || 0),\n    domNodes: Number(payload.domNodes || 0),\n    messageTurns: Number(payload.messageTurns || 0),\n    codeBlocks: Number(payload.codeBlocks || 0),\n    iframes: Number(payload.iframes || 0),\n    guardActive: Boolean(payload.guardActive),\n    guardHeavy: Boolean(payload.guardHeavy),\n    guardToolSurfaces: Number(payload.guardToolSurfaces || 0),\n    guardSkippedTools: Number(payload.guardSkippedTools || 0),\n    guardSkippedTurns: Number(payload.guardSkippedTurns || 0),\n  };\n}\n\napi.runtime.onMessage.addListener((message, sender) => {\n  if (message?.type !== "bcg:perf-heartbeat" || !sender.tab?.id) return;\n  const payload = message.payload || {};\n  const key = watchKey(sender, payload);\n  const now = Date.now();\n  const existing = watches.get(key);\n  if (existing?.timer) clearTimeout(existing.timer);\n  if (existing?.suspectedAt) void markRecovered(key, new Date(now).toISOString(), now - Number(existing.lastAt || now));\n\n  const lastHeartbeat = heartbeatSnapshot(payload, now);\n  const recentHeartbeats = Array.isArray(existing?.recentHeartbeats)\n    ? existing.recentHeartbeats.slice(-(MAX_HEARTBEATS - 1))\n    : [];\n  recentHeartbeats.push(lastHeartbeat);\n\n  const record = {\n    watchKey: key,\n    lastAt: Number(payload.at || now),\n    lastHeartbeat,\n    recentHeartbeats,\n    suspectedAt: 0,\n    timer: 0,\n  };\n\n  record.timer = setTimeout(() => {\n    record.suspectedAt = Date.now();\n    watches.set(key, record);\n    void storeHang({\n      watchKey: key,\n      detectedAt: new Date(record.suspectedAt).toISOString(),\n      thresholdMs: HANG_AFTER_MS,\n      lastHeartbeat: record.lastHeartbeat,\n      recentHeartbeats: record.recentHeartbeats.slice(-MAX_HEARTBEATS),\n      recoveredAt: null,\n    });\n  }, HANG_AFTER_MS);\n  watches.set(key, record);\n});\n'''
          Path('chromium/performance-background.js').write_text(bg, encoding='utf-8')

          guard = r'''(() => {\n  "use strict";\n\n  const BCG = globalThis.BetterChatGPT;\n  if (!BCG || globalThis.__bcgNativeToolFreezeGuard) return;\n\n  const STYLE_ID = "bcg-native-tool-freeze-guard-style";\n  const ROOT_ACTIVE_ATTR = "data-bcg-native-freeze-guard";\n  const ROOT_HEAVY_ATTR = "data-bcg-native-freeze-guard-heavy";\n  const TURN_SKIP_CLASS = "bcg-native-freeze-guard-turn-skip";\n  const TOOL_SKIP_CLASS = "bcg-native-freeze-guard-tool-skip";\n  const HEAVY_TOOL_THRESHOLD = 4;\n  const PROTECTED_TAIL_TURNS = 3;\n  const SCAN_DELAY_MS = 100;\n  const NEAR_VIEWPORT_MARGIN_PX = 1600;\n\n  const TURN_SELECTOR = 'article[data-testid^="conversation-turn"]';\n  const TOOL_SELECTOR = [\n    '[data-testid*="tool" i]',\n    '[data-testid*="connector" i]',\n    '[data-testid*="mcp" i]',\n    '[data-testid*="work" i]',\n    'iframe[src*="mcp" i]',\n    'iframe[title*="tool" i]',\n  ].join(",");\n  const NON_SURFACE_TESTID = /(?:button|trigger|menu|icon|badge|status|label|toggle|header|footer|action|chevron|spinner)/i;\n  const NON_SURFACE_TAGS = new Set(["BUTTON", "A", "INPUT", "TEXTAREA", "SELECT", "OPTION", "SVG", "PATH"]);\n\n  const trackedTurns = new Set();\n  const turnOrder = [];\n  const trackedTools = new Set();\n  const nearViewport = new WeakMap();\n  const pendingRoots = new Set();\n\n  let observer = null;\n  let intersectionObserver = null;\n  let scanTimer = 0;\n  let active = false;\n  let heavy = false;\n  let markedToolCount = 0;\n  let skippedToolCount = 0;\n  let skippedTurnCount = 0;\n\n  function featureEnabled() {\n    return Boolean(BCG.settings?.enabled)\n      && Boolean(BCG.settings?.advanced?.nativeToolFreezeGuard)\n      && !Boolean(BCG.isTabDisabled?.());\n  }\n\n  function generationActive() {\n    return Boolean(document.querySelector(\n      '[data-testid="stop-button"], button[aria-label*="stop generating" i], button[aria-label="Stop"]',\n    ));\n  }\n\n  function ensureStyle() {\n    if (document.getElementById(STYLE_ID)) return;\n    const style = document.createElement("style");\n    style.id = STYLE_ID;\n    style.textContent = `\n      html[${ROOT_ACTIVE_ATTR}="1"][${ROOT_HEAVY_ATTR}="1"] .${TURN_SKIP_CLASS} {\n        content-visibility: auto;\n        contain-intrinsic-size: auto 720px;\n      }\n\n      html[${ROOT_ACTIVE_ATTR}="1"][${ROOT_HEAVY_ATTR}="1"] .${TOOL_SKIP_CLASS} {\n        content-visibility: auto;\n        contain-intrinsic-size: auto 180px;\n      }\n    `;\n    (document.head || document.documentElement).appendChild(style);\n  }\n\n  function getIntersectionObserver() {\n    if (intersectionObserver) return intersectionObserver;\n    intersectionObserver = new IntersectionObserver((entries) => {\n      for (const entry of entries) nearViewport.set(entry.target, entry.isIntersecting);\n      applyVisibilityPolicy();\n    }, {\n      root: null,\n      rootMargin: `${NEAR_VIEWPORT_MARGIN_PX}px 0px ${NEAR_VIEWPORT_MARGIN_PX}px 0px`,\n      threshold: 0,\n    });\n    return intersectionObserver;\n  }\n\n  function trackTurn(turn) {\n    if (!(turn instanceof HTMLElement) || trackedTurns.has(turn)) return;\n    trackedTurns.add(turn);\n    turnOrder.push(turn);\n    nearViewport.set(turn, true);\n    getIntersectionObserver().observe(turn);\n  }\n\n  function untrackTool(tool) {\n    if (!trackedTools.delete(tool)) return;\n    intersectionObserver?.unobserve(tool);\n    tool.classList?.remove(TOOL_SKIP_CLASS);\n  }\n\n  function trackTool(tool) {\n    if (!(tool instanceof Element) || trackedTools.has(tool)) return;\n    for (const existing of Array.from(trackedTools)) {\n      if (!existing.isConnected) {\n        untrackTool(existing);\n        continue;\n      }\n      if (existing.contains(tool)) untrackTool(existing);\n      else if (tool.contains(existing)) return;\n    }\n    trackedTools.add(tool);\n    nearViewport.set(tool, true);\n    getIntersectionObserver().observe(tool);\n  }\n\n  function looksLikeToolSurface(element) {\n    if (!(element instanceof Element)) return false;\n    if (element.tagName === "IFRAME") return true;\n    if (!(element instanceof HTMLElement)) return false;\n    if (NON_SURFACE_TAGS.has(element.tagName)) return false;\n    const testId = String(element.getAttribute("data-testid") || "");\n    if (NON_SURFACE_TESTID.test(testId)) return false;\n    if (element.children.length >= 2) return true;\n    return Boolean(element.querySelector("iframe, pre, code, button, [role=button], [role=region], [aria-expanded]"));\n  }\n\n  function scanRoot(root) {\n    if (!(root instanceof Document || root instanceof Element)) return;\n\n    if (root instanceof Element && root.matches(TURN_SELECTOR)) trackTurn(root);\n    for (const turn of root.querySelectorAll?.(TURN_SELECTOR) || []) trackTurn(turn);\n\n    const candidates = [];\n    if (root instanceof Element && root.matches(TOOL_SELECTOR)) candidates.push(root);\n    candidates.push(...root.querySelectorAll?.(TOOL_SELECTOR) || []);\n    const qualified = candidates.filter(looksLikeToolSurface);\n    const qualifiedSet = new Set(qualified);\n    for (const candidate of qualified) {\n      let hasQualifiedChild = false;\n      if (candidate.tagName !== "IFRAME") {\n        for (const child of candidate.querySelectorAll(TOOL_SELECTOR)) {\n          if (child !== candidate && qualifiedSet.has(child)) {\n            hasQualifiedChild = true;\n            break;\n          }\n        }\n      }\n      if (!hasQualifiedChild) trackTool(candidate);\n    }\n  }\n\n  function isInteractionProtected(element) {\n    const focused = document.activeElement;\n    if (focused instanceof Node && element.contains(focused)) return true;\n    const selection = window.getSelection?.();\n    if (selection?.anchorNode && !selection.isCollapsed && element.contains(selection.anchorNode)) return true;\n    try {\n      return Boolean(element.querySelector(\n        '[aria-expanded="true"], [data-state="open"], [role="dialog"], [role="menu"], [popover]:popover-open',\n      ));\n    } catch {\n      return Boolean(element.querySelector('[aria-expanded="true"], [data-state="open"], [role="dialog"], [role="menu"]'));\n    }\n  }\n\n  function protectedTailSet() {\n    const connected = [];\n    for (let i = turnOrder.length - 1; i >= 0 && connected.length < PROTECTED_TAIL_TURNS; i -= 1) {\n      const turn = turnOrder[i];\n      if (turn?.isConnected) connected.push(turn);\n    }\n    return new Set(connected);\n  }\n\n  function applyVisibilityPolicy() {\n    const protectedTail = protectedTailSet();\n    let nextSkippedTurns = 0;\n    let nextSkippedTools = 0;\n\n    for (const turn of Array.from(trackedTurns)) {\n      if (!turn.isConnected) {\n        trackedTurns.delete(turn);\n        intersectionObserver?.unobserve(turn);\n        continue;\n      }\n      const shouldSkip = active\n        && heavy\n        && nearViewport.get(turn) === false\n        && !protectedTail.has(turn)\n        && !isInteractionProtected(turn);\n      turn.classList.toggle(TURN_SKIP_CLASS, shouldSkip);\n      if (shouldSkip) nextSkippedTurns += 1;\n    }\n\n    for (const tool of Array.from(trackedTools)) {\n      if (!tool.isConnected) {\n        untrackTool(tool);\n        continue;\n      }\n      const shouldSkip = active\n        && heavy\n        && nearViewport.get(tool) === false\n        && !isInteractionProtected(tool);\n      tool.classList.toggle(TOOL_SKIP_CLASS, shouldSkip);\n      if (shouldSkip) nextSkippedTools += 1;\n    }\n\n    skippedTurnCount = nextSkippedTurns;\n    skippedToolCount = nextSkippedTools;\n  }\n\n  function toolSurfaceLabels() {\n    const labels = new Set();\n    for (const element of trackedTools) {\n      if (!element.isConnected) continue;\n      const testId = String(element.getAttribute?.("data-testid") || "").trim();\n      if (testId) labels.add(testId.slice(0, 100));\n      else if (element.tagName === "IFRAME") labels.add("iframe");\n      else labels.add(String(element.tagName || "element").toLowerCase());\n      if (labels.size >= 12) break;\n    }\n    return Array.from(labels);\n  }\n\n  function refreshState() {\n    if (!active) return;\n    for (const tool of Array.from(trackedTools)) if (!tool.isConnected) untrackTool(tool);\n    markedToolCount = trackedTools.size;\n    const nextHeavy = generationActive() && markedToolCount >= HEAVY_TOOL_THRESHOLD;\n    if (heavy !== nextHeavy) {\n      heavy = nextHeavy;\n      document.documentElement.toggleAttribute(ROOT_HEAVY_ATTR, heavy);\n      BCG.recordTrace?.(heavy ? "native-tool-freeze-guard-heavy" : "native-tool-freeze-guard-normal", {\n        toolSurfaces: markedToolCount,\n        toolSurfaceLabels: heavy ? toolSurfaceLabels() : [],\n        skippedTools: skippedToolCount,\n        skippedTurns: skippedTurnCount,\n        generating: generationActive(),\n      });\n    }\n    applyVisibilityPolicy();\n  }\n\n  function enqueueRoot(root) {\n    if (!(root instanceof Element)) return;\n    for (const existing of Array.from(pendingRoots)) {\n      if (existing.contains(root)) return;\n      if (root.contains(existing)) pendingRoots.delete(existing);\n    }\n    pendingRoots.add(root);\n  }\n\n  function runScheduledScan() {\n    scanTimer = 0;\n    if (!active) return;\n    const roots = Array.from(pendingRoots);\n    pendingRoots.clear();\n    for (const root of roots) scanRoot(root);\n    refreshState();\n  }\n\n  function scheduleScan() {\n    if (!active || scanTimer) return;\n    scanTimer = window.setTimeout(runScheduledScan, SCAN_DELAY_MS);\n  }\n\n  function startObserver() {\n    if (observer || !document.documentElement) return;\n    observer = new MutationObserver((records) => {\n      let changed = false;\n      for (const record of records) {\n        if (record.type !== "childList") continue;\n        if (record.addedNodes.length || record.removedNodes.length) changed = true;\n        for (const node of record.addedNodes) if (node instanceof Element) enqueueRoot(node);\n      }\n      if (changed) scheduleScan();\n    });\n    observer.observe(document.documentElement, { childList: true, subtree: true });\n  }\n\n  function start() {\n    if (active || !featureEnabled()) return;\n    active = true;\n    ensureStyle();\n    document.documentElement.setAttribute(ROOT_ACTIVE_ATTR, "1");\n    startObserver();\n    scanRoot(document);\n    refreshState();\n    BCG.recordTrace?.("native-tool-freeze-guard-started", {\n      heavyToolThreshold: HEAVY_TOOL_THRESHOLD,\n      nearViewportMarginPx: NEAR_VIEWPORT_MARGIN_PX,\n      toolSurfaces: markedToolCount,\n    });\n  }\n\n  function stop() {\n    if (!active) return;\n    active = false;\n    observer?.disconnect();\n    observer = null;\n    intersectionObserver?.disconnect();\n    intersectionObserver = null;\n    window.clearTimeout(scanTimer);\n    scanTimer = 0;\n    pendingRoots.clear();\n    heavy = false;\n    markedToolCount = trackedTools.size;\n    skippedToolCount = 0;\n    skippedTurnCount = 0;\n    document.documentElement.removeAttribute(ROOT_ACTIVE_ATTR);\n    document.documentElement.removeAttribute(ROOT_HEAVY_ATTR);\n    for (const turn of trackedTurns) turn.classList?.remove(TURN_SKIP_CLASS);\n    for (const tool of trackedTools) tool.classList?.remove(TOOL_SKIP_CLASS);\n    BCG.recordTrace?.("native-tool-freeze-guard-stopped", {});\n  }\n\n  function syncEnabledState() {\n    if (featureEnabled()) {\n      start();\n      refreshState();\n    } else {\n      stop();\n    }\n  }\n\n  window.addEventListener("bcg:settings-changed", syncEnabledState);\n  window.addEventListener("pageshow", () => {\n    syncEnabledState();\n    if (active) {\n      scanRoot(document);\n      refreshState();\n    }\n  }, { passive: true });\n\n  const api = {\n    status() {\n      return {\n        active,\n        heavy,\n        markedToolCount: trackedTools.size,\n        skippedToolCount,\n        skippedTurnCount,\n        threshold: HEAVY_TOOL_THRESHOLD,\n        nearViewportMarginPx: NEAR_VIEWPORT_MARGIN_PX,\n        protectedTailTurns: PROTECTED_TAIL_TURNS,\n        toolSurfaceLabels: toolSurfaceLabels(),\n      };\n    },\n    rescan() {\n      if (active) {\n        scanRoot(document);\n        refreshState();\n      }\n      return this.status();\n    },\n    stop,\n    start,\n  };\n\n  globalThis.__bcgNativeToolFreezeGuard = api;\n  BCG.nativeToolFreezeGuard = api;\n  syncEnabledState();\n})();\n'''
          Path('chromium/performance-guard.js').write_text(guard, encoding='utf-8')

          manifest_path = Path('chromium/manifest.json')
          import json
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          scripts = manifest['content_scripts'][1]['js']
          if 'performance-guard.js' not in scripts:
              scripts.append('performance-guard.js')
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          regression_path = Path('tools/regression-check.mjs')
          r = regression_path.read_text(encoding='utf-8')
          r = replace_once(
              r,
              'const firefoxBuilder = fs.readFileSync("tools/build-firefox.mjs", "utf8");\n',
              'const firefoxBuilder = fs.readFileSync("tools/build-firefox.mjs", "utf8");\nconst guard = fs.readFileSync("chromium/performance-guard.js", "utf8");\nconst perfBackground = fs.readFileSync("chromium/performance-background.js", "utf8");\n',
              'regression guard inputs',
          )
          marker = 'requireText(content, \'const VERSION = "1.1-pre.2";\', "runtime pre.2 version");\n'
          insert = marker + '''requireText(content, 'nativeToolFreezeGuard: true', "native tool freeze guard default");\nrequireText(content, 'setting("advanced.nativeToolFreezeGuard", "Native tool freeze guard"', "native tool freeze guard setting");\nrequireText(content, 'nativeToolFreezeGuard: apiObject.nativeToolFreezeGuard?.status?.() || null', "guard diagnostics");\nforbidText(content, 'setTimeout(() => location.reload(), 120);', "popup master toggle forced reload");\nrequireText(guard, 'const HEAVY_TOOL_THRESHOLD = 4;', "adaptive guard heavy threshold");\nrequireText(guard, 'IntersectionObserver', "offscreen-only guard observer");\nrequireText(guard, 'nearViewport.get(tool) === false', "only offscreen tool surfaces are skipped");\nrequireText(guard, 'protectedTailSet()', "active tail turns stay rendered");\nforbidText(guard, 'contain: layout style;', "broad tool layout containment");\nrequireText(perfBackground, 'const MAX_HEARTBEATS = 12;', "hang recorder heartbeat runway");\nrequireText(perfBackground, 'recentHeartbeats', "persist heartbeat runway");\nrequireText(perfBackground, 'guardSkippedTools', "persist guard state in heartbeat runway");\nif (!manifest.content_scripts?.some((entry) => entry.js?.includes('performance-guard.js'))) throw new Error('performance-guard.js is not packaged');\n'''
          r = replace_once(r, marker, insert, 'regression guard assertions')
          regression_path.write_text(r, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          ch = changelog_path.read_text(encoding='utf-8')
          if 'Native tool freeze guard' not in ch:
              anchor = '## Unreleased\n'
              if anchor in ch:
                  ch = ch.replace(anchor, anchor + '- Added an adaptive **Native tool freeze guard** for tool-heavy generation. It only skips offscreen surfaces while the renderer is under tool load, protects the active conversation tail, is independently toggleable, and records guard state in hang diagnostics.\n', 1)
              changelog_path.write_text(ch, encoding='utf-8')
          PY

      - name: Validate combined PR tree
        shell: bash
        run: |
          set -euo pipefail
          node tools/regression-check.mjs
          find chromium -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          node --check tools/build-firefox.mjs
          node tools/build-firefox.mjs
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('chromium/manifest.json', 'utf8'));
          const f = JSON.parse(fs.readFileSync('build/firefox-src/manifest.json', 'utf8'));
          if (c.version !== '1.1.2' || c.version_name !== '1.1-pre.2') throw new Error('pre.2 version metadata was lost');
          if (f.version !== c.version) throw new Error('Firefox version mismatch');
          if (!c.content_scripts.some((entry) => entry.js?.includes('performance-guard.js'))) throw new Error('Chromium guard missing');
          if (!f.content_scripts.some((entry) => entry.js?.includes('performance-guard.js'))) throw new Error('Firefox guard missing');
          NODE
          npx --yes web-ext@10 lint --source-dir build/firefox-src
          git diff --check

      - name: Push refined PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chromium/content.js chromium/manifest.json chromium/performance-background.js chromium/performance-guard.js tools/regression-check.mjs CHANGELOG.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Refine adaptive native tool freeze guard'
          fi
          git push origin HEAD:fix/native-tool-freeze-guard
