name: Publish signed Firefox v1.1 artifact

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-firefox-xpi.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download signed Firefox artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bcg-firefox
          mkdir -p /tmp/bcg-firefox
          gh run download 33234785107 \
            --repo "$GITHUB_REPOSITORY" \
            --name BetterChatGPT-Firefox-1.1 \
            --dir /tmp/bcg-firefox

          signed=/tmp/bcg-firefox/BetterChatGPT-firefox-v1.1.xpi
          test -f "$signed"
          echo '9cbc02d768fc6b84799085615fd5282fc47c76342283865b8d7eae9c85e9a727  /tmp/bcg-firefox/BetterChatGPT-firefox-v1.1.xpi' | sha256sum -c -
          unzip -t "$signed" >/dev/null
          unzip -l "$signed" | grep -q 'META-INF/mozilla.rsa'

          cp "$signed" artifacts/BetterChatGPT-firefox-v1.1.xpi
          cat > artifacts/SHA256SUMS.txt <<'EOF'
          1bae81ab244260292144481b72f68bf16928dd35ce8427fa78467fe6185720b6  BetterChatGPT-chromium-v1.1.zip
          9cbc02d768fc6b84799085615fd5282fc47c76342283865b8d7eae9c85e9a727  BetterChatGPT-firefox-v1.1.xpi
          EOF

      - name: Commit signed XPI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/BetterChatGPT-firefox-v1.1.xpi artifacts/SHA256SUMS.txt
          git commit -m 'Add Mozilla-signed BetterChatGPT Firefox v1.1 XPI'
          git push origin HEAD:main
