name: Build and publish BetterChatGPT v1.1 pre.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pre2-release.yml"

permissions:
  contents: write

env:
  AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
  AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

jobs:
  pre2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Apply pre.2 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          content_path = root / 'chromium/content.js'
          bridge_path = root / 'chromium/page-bridge.js'
          manifest_path = root / 'chromium/manifest.json'
          build_ff_path = root / 'tools/build-firefox.mjs'
          ff_workflow_path = root / '.github/workflows/firefox.yml'
          readme_path = root / 'README.md'
          chromium_readme_path = root / 'chromium/README.md'
          changelog_path = root / 'CHANGELOG.md'
          amo_notes_path = root / 'AMO_REVIEW_NOTES.md'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          c = content_path.read_text(encoding='utf-8')
          c = replace_once(c, 'const VERSION = "1.1";', 'const VERSION = "1.1-pre.2";', 'runtime version')

          c = replace_once(
              c,
              'function updateSettings(patch, { announce = false, reloadRequired = true, preserveProfile = false } = {}) {',
              'function updateSettings(patch, { announce = false, reloadRequired = false, preserveProfile = false } = {}) {',
              'live updateSettings default',
          )
          c = replace_once(c, 'if (options.reloadRequired !== false) markReloadRequired();', 'if (options.reloadRequired === true) markReloadRequired();', 'live imported settings')
          c = replace_once(c, 'if (options.announce !== false) notify("Settings imported. Reload ChatGPT to apply every change.");', 'if (options.announce !== false) notify("Settings imported.");', 'import notification')
          c = replace_once(
              c,
              '    markReloadRequired();\n    dispatchSettingsChanged("profile");\n    notify(`${profile[0].toUpperCase()}${profile.slice(1)} profile applied. Reload ChatGPT.`);',
              '    dispatchSettingsChanged("profile");\n    notify(`${profile[0].toUpperCase()}${profile.slice(1)} profile applied.`);',
              'live profiles',
          )
          c = replace_once(
              c,
              '  function isLiveSettingPath(path) {\n    return path === "sync"\n      || path.startsWith("appearance.")\n      || path.startsWith("layout.")\n      || path.startsWith("ui.");\n  }',
              '  function isLiveSettingPath(path) {\n    return FIELD_BY_PATH.has(path) || path.startsWith("ui.");\n  }',
              'all settings live path',
          )
          c = replace_once(
              c,
              '    const reloadRequired = !["appearance", "layout"].includes(section.id);\n    updateSettings(patch, { reloadRequired });',
              '    updateSettings(patch, { reloadRequired: false });',
              'live section reset',
          )
          c = replace_once(c, 'if (note) note.textContent = active ? "Appearance and layout apply instantly." : "Enable Better ChatGPT in General settings.";', 'if (note) note.textContent = active ? "Settings apply instantly." : "Enable Better ChatGPT in General settings.";', 'live status note')

          c = replace_once(
              c,
              '    const wake = makeButton("Wake all messages", () => {\n      window.dispatchEvent(new Event("bcg:wake-all"));\n      document.querySelectorAll(".cgpt-lco-hibernated").forEach((node) => node.classList.remove("cgpt-lco-hibernated"));\n      notify("All optimized messages are awake.");\n    });\n',
              '',
              'remove obsolete optimizer wake action',
          )
          c = replace_once(c, 'actions.append(reload, wake, exportButton, importButton, diagnosticButton, showReport, resetButton);', 'actions.append(reload, exportButton, importButton, diagnosticButton, showReport, resetButton);', 'remove wake button append')

          c = replace_once(
              c,
              'if (globalThis.BetterChatGPT?.settings.enabled && !globalThis.BetterChatGPT?.isTabDisabled() && (true)) {',
              'if (globalThis.BetterChatGPT) {',
              'always install appearance runtime',
          )
          c = replace_once(
              c,
              '        bubble.querySelectorAll("*").forEach((node) => {\n          if (!(node instanceof HTMLElement)) return;\n          if (node.closest(\'pre, code, button, [role="button"]\')) return;\n          setManagedStyle(node, "color", globalThis.BetterChatGPT.getBubbleTextColor());\n        });',
              '        bubble.querySelectorAll("*").forEach((node) => {\n          if (!(node instanceof HTMLElement)) return;\n          if (node.closest(\'a[href], [role="link"]\')) {\n            setManagedStyle(node, "color", "LinkText");\n            return;\n          }\n          if (node.closest(\'pre, code, button, [role="button"]\')) return;\n          setManagedStyle(node, "color", globalThis.BetterChatGPT.getBubbleTextColor());\n        });',
              'user bubble link color',
          )

          c = replace_once(
              c,
              'if (globalThis.BetterChatGPT?.isFeatureEnabled("scrolling.enabled")) {',
              'if (globalThis.BetterChatGPT) {',
              'always install scrolling runtime',
          )
          c = replace_once(
              c,
              '      const ARM_DISTANCE_PX = globalThis.BetterChatGPT.settings.scrolling.armDistancePx;\n      const STABLE_MS = globalThis.BetterChatGPT.settings.scrolling.stableMs;\n      const MAX_FOLLOW_MS = globalThis.BetterChatGPT.settings.scrolling.maxFollowMs;\n      const BOTTOM_TOLERANCE_PX = 3;\n      const MANUAL_PAUSE_MS = globalThis.BetterChatGPT.settings.scrolling.manualPauseMs;\n      const USER_TRANSCRIPT_GROWTH_WINDOW_MS = 6000;\n      const VOICE_LATCH_MS = globalThis.BetterChatGPT.settings.scrolling.voiceLatchMs;\n\n      function computeFollowTarget(maximum) {',
              '      const BOTTOM_TOLERANCE_PX = 3;\n      const USER_TRANSCRIPT_GROWTH_WINDOW_MS = 6000;\n\n      function scrollingEnabled() {\n        return Boolean(globalThis.BetterChatGPT?.isFeatureEnabled?.("scrolling.enabled"));\n      }\n\n      function liveScrollNumber(key, fallback) {\n        const value = Number(globalThis.BetterChatGPT?.settings?.scrolling?.[key]);\n        return Number.isFinite(value) ? value : fallback;\n      }\n\n      const armDistancePx = () => liveScrollNumber("armDistancePx", 600);\n      const stableMs = () => liveScrollNumber("stableMs", 1800);\n      const maxFollowMs = () => liveScrollNumber("maxFollowMs", 12000);\n      const manualPauseMs = () => liveScrollNumber("manualPauseMs", 2500);\n      const voiceLatchMs = () => liveScrollNumber("voiceLatchMs", 90000);\n\n      function computeFollowTarget(maximum) {',
              'live scrolling values',
          )
          c = replace_once(c, 'function shouldArmFollow(distanceFromBottom, threshold = ARM_DISTANCE_PX) {', 'function shouldArmFollow(distanceFromBottom, threshold = armDistancePx()) {', 'live scroll arm distance')
          c = replace_once(c, 'function shouldStopFollow(now, startedAt, stableSince, stableMs = STABLE_MS, maxMs = MAX_FOLLOW_MS) {', 'function shouldStopFollow(now, startedAt, stableSince, stableWindowMs = stableMs(), maxMs = maxFollowMs()) {', 'live scroll stop signature')
          c = replace_once(c, 'return now - startedAt >= maxMs || now - stableSince >= stableMs;', 'return now - startedAt >= maxMs || now - stableSince >= stableWindowMs;', 'live scroll stop body')
          c = c.replace('now + VOICE_LATCH_MS', 'now + voiceLatchMs()')
          if 'VOICE_LATCH_MS' in c:
              raise RuntimeError('live scrolling: stale VOICE_LATCH_MS remains')
          c = replace_once(c, 'manualPauseUntil = win.performance.now() + MANUAL_PAUSE_MS;', 'manualPauseUntil = win.performance.now() + manualPauseMs();', 'live manual pause')
          c = replace_once(
              c,
              '        function tick() {\n          timer = 0;\n          if (destroyed) return;\n\n          const now = win.performance.now();',
              '        function tick() {\n          timer = 0;\n          if (destroyed || !scrollingEnabled()) return;\n\n          const now = win.performance.now();',
              'scroll tick live disable',
          )
          c = replace_once(
              c,
              '        function pauseForManualScroll() {\n          manualPauseUntil = win.performance.now() + manualPauseMs();',
              '        function pauseForManualScroll() {\n          if (!scrollingEnabled()) return;\n          manualPauseUntil = win.performance.now() + manualPauseMs();',
              'manual scroll live disable',
          )
          c = replace_once(
              c,
              '        win.__chatgptHybridScroll = {',
              '        function syncRuntimeSettings() {\n          modeOverride = globalThis.BetterChatGPT?.settings?.scrolling?.mode || "auto";\n          if (!scrollingEnabled()) {\n            win.clearTimeout(timer);\n            timer = 0;\n            manualPauseUntil = 0;\n            manualScrollHold = false;\n            cancelPendingAutomaticScroll();\n            stopFollow();\n            return;\n          }\n          if (!timer) timer = win.setTimeout(tick, POLL_MS);\n        }\n\n        win.__chatgptHybridScroll = {',
              'scroll settings listener helper',
          )
          c = replace_once(
              c,
              '          forceVoiceFollow() {\n            modeOverride = "voice";',
              '          forceVoiceFollow() {\n            if (!scrollingEnabled()) return false;\n            modeOverride = "voice";',
              'force voice respects disabled',
          )
          c = replace_once(
              c,
              '            doc.removeEventListener("keydown", onKeyDown, true);\n            restoreHistoryHooks();',
              '            doc.removeEventListener("keydown", onKeyDown, true);\n            win.removeEventListener("bcg:settings-changed", syncRuntimeSettings);\n            restoreHistoryHooks();',
              'scroll settings cleanup',
          )
          c = replace_once(
              c,
              '        timer = win.setTimeout(tick, POLL_MS);\n      }\n\n      return {',
              '        win.addEventListener("bcg:settings-changed", syncRuntimeSettings);\n        syncRuntimeSettings();\n      }\n\n      return {',
              'scroll live startup',
          )

          c = replace_once(
              c,
              'if (globalThis.BetterChatGPT?.settings.enabled && !globalThis.BetterChatGPT?.isTabDisabled() && globalThis.BetterChatGPT.settings.queue.enabled) {',
              'if (globalThis.BetterChatGPT) {',
              'always install queue runtime',
          )
          c = replace_once(
              c,
              '      const CHECK_INTERVAL_MS = 250;\n      const MAX_QUEUE_MS = globalThis.BetterChatGPT.settings.queue.maxQueueMs;\n      const KEEP_SEND_BUTTON_VISUALLY_ENABLED = globalThis.BetterChatGPT.settings.queue.visuallyEnableSend;\n      const NATIVE_COMPOSER_SETTLE_MS = 2500;\n      const NATIVE_PAYLOAD_VISUAL_GRACE_MS = 120;\n      const NATIVE_PAYLOAD_HINT_MS = MAX_QUEUE_MS;\n      const POINTER_QUEUE_GESTURE_DEDUPE_MS = 450;\n      const DEBUG = globalThis.BetterChatGPT.settings.advanced.debug;',
              '      const CHECK_INTERVAL_MS = 250;\n      const NATIVE_COMPOSER_SETTLE_MS = 2500;\n      const NATIVE_PAYLOAD_VISUAL_GRACE_MS = 120;\n      const POINTER_QUEUE_GESTURE_DEDUPE_MS = 450;\n      const queueFeatureEnabled = () => Boolean(globalThis.BetterChatGPT?.isFeatureEnabled?.("queue.enabled"));\n      const maxQueueMs = () => Number(globalThis.BetterChatGPT?.settings?.queue?.maxQueueMs) || 600000;\n      const keepSendButtonVisuallyEnabled = () => Boolean(globalThis.BetterChatGPT?.isFeatureEnabled?.("queue.visuallyEnableSend"));\n      const nativePayloadHintMs = () => maxQueueMs();',
              'live queue constants',
          )
          c = replace_once(c, 'if (DEBUG) console.log("[ChatGPT queued send]", ...args);', 'if (globalThis.BetterChatGPT?.settings?.advanced?.debug) console.log("[ChatGPT queued send]", ...args);', 'live queue debug')
          c = replace_once(c, 'nativePayloadHintUntil = Math.max(nativePayloadHintUntil, now + NATIVE_PAYLOAD_HINT_MS);', 'nativePayloadHintUntil = Math.max(nativePayloadHintUntil, now + nativePayloadHintMs());', 'live queue payload hint')
          c = replace_once(
              c,
              '      function updateVisualSendButton() {\n        if (!KEEP_SEND_BUTTON_VISUALLY_ENABLED) return;\n\n        installVisualOverrideStyle();',
              '      function updateVisualSendButton() {\n        if (!queueFeatureEnabled() || !keepSendButtonVisuallyEnabled()) {\n          if (visuallyOverriddenButton) clearVisualOverride(visuallyOverriddenButton);\n          return;\n        }\n\n        installVisualOverrideStyle();',
              'live queue visual setting',
          )
          c = replace_once(
              c,
              '      function shouldInterceptSendGesture() {\n        if (internalQueuedSendClick) return false;',
              '      function shouldInterceptSendGesture() {\n        if (!queueFeatureEnabled() || internalQueuedSendClick) return false;',
              'queue intercept live switch',
          )
          c = replace_once(
              c,
              '      function checkQueue() {\n        if (\n          !queued && isNativeComposerBusy()',
              '      function checkQueue() {\n        if (!queueFeatureEnabled()) {\n          if (queued) cancelQueue("Queued send canceled because queued sending was disabled.");\n          clearQueuedComposerFiles();\n          clearNativePayloadHint();\n          nativeComposerBusyUntil = 0;\n          if (visuallyOverriddenButton) clearVisualOverride(visuallyOverriddenButton);\n          return;\n        }\n        if (\n          !queued && isNativeComposerBusy()',
              'queue live disable cleanup',
          )
          c = replace_once(c, 'if (Date.now() - queuedAt > MAX_QUEUE_MS) {', 'if (Date.now() - queuedAt > maxQueueMs()) {', 'live queue expiry')
          c = replace_once(c, 'if (!globalThis.BetterChatGPT.settings.queue.enabled) return false;', 'if (!queueFeatureEnabled()) return false;', 'queue send live switch')

          native_observer = '''      function eventIsInComposer(event) {\n        const root = getComposerRoot();\n        return Boolean(root && root.contains(event.target));\n      }\n\n      window.addEventListener(\n        "change",'''
          native_observer_new = '''      function eventIsInComposer(event) {\n        const root = getComposerRoot();\n        return Boolean(root && root.contains(event.target));\n      }\n\n      function filesFromNativeTransfer(event) {\n        const transfer = event?.clipboardData || event?.dataTransfer;\n        if (!transfer) return [];\n        const files = Array.from(transfer.files || []).filter((file) => file instanceof File);\n        for (const item of Array.from(transfer.items || [])) {\n          if (item?.kind !== "file") continue;\n          const file = item.getAsFile?.();\n          if (file instanceof File && !files.some((candidate) => fileKey(candidate) === fileKey(file))) files.push(file);\n        }\n        return files;\n      }\n\n      for (const eventName of ["paste", "drop"]) {\n        document.addEventListener(\n          eventName,\n          (event) => {\n            if (!queueFeatureEnabled() || !eventIsInComposer(event) || !isAssistantGenerating()) return;\n            const files = filesFromNativeTransfer(event);\n            if (!files.length) return;\n            // Observe only. ChatGPT keeps full ownership of paste/drop and native upload.\n            rememberQueuedComposerFiles(files);\n            markNativeComposerBusy(`native ${eventName} attachment`, event);\n          },\n          true,\n        );\n      }\n\n      window.addEventListener(\n        "change",'''
          c = replace_once(c, native_observer, native_observer_new, 'native paste/drop file observation')
          c = replace_once(
              c,
              '        (event) => {\n          if (event.target instanceof Element && event.target.closest(\'.bcg-edit-enhanced, [data-testid*="edit" i]\')) return;\n          if (!eventIsFileInputWithFiles(event)) return;',
              '        (event) => {\n          if (!queueFeatureEnabled()) return;\n          if (event.target instanceof Element && event.target.closest(\'.bcg-edit-enhanced, [data-testid*="edit" i]\')) return;\n          if (!eventIsFileInputWithFiles(event)) return;',
              'file input queue switch',
          )
          c = replace_once(
              c,
              '        (event) => {\n          const inputType = event.inputType || "";\n\n          if (/insertFromPaste|insertFromDrop|insertReplacementText/i.test(inputType)',
              '        (event) => {\n          if (!queueFeatureEnabled()) return;\n          const inputType = event.inputType || "";\n\n          if (/insertFromPaste|insertFromDrop|insertReplacementText/i.test(inputType)',
              'beforeinput queue switch',
          )
          c = replace_once(
              c,
              '        (event) => {\n          if (eventIsFileInputWithFiles(event)) {\n            markNativeComposerBusy("file input", event);',
              '        (event) => {\n          if (!queueFeatureEnabled()) return;\n          if (eventIsFileInputWithFiles(event)) {\n            markNativeComposerBusy("file input", event);',
              'input queue switch',
          )
          c = replace_once(
              c,
              '      setInterval(() => {\n        scheduleCheck();\n      }, 750);',
              '      window.addEventListener("bcg:settings-changed", scheduleCheck);\n\n      setInterval(() => {\n        scheduleCheck();\n      }, 750);',
              'queue live settings listener',
          )

          c = replace_once(
              c,
              'if (globalThis.BetterChatGPT?.isFeatureEnabled("composer.enabled")) {',
              'if (globalThis.BetterChatGPT) {',
              'always install plain composer runtime',
          )
          c = replace_once(
              c,
              '        (event) => {\n          const composer = getComposerFromNode(event.target);\n          if (!composer) return;\n\n          // The existing queue/upload script owns live-follow-up pastes.',
              '        (event) => {\n          if (!globalThis.BetterChatGPT?.isFeatureEnabled?.("composer.enabled")) return;\n          const composer = getComposerFromNode(event.target);\n          if (!composer) return;\n\n          // ChatGPT owns live follow-up paste/upload handling while generation is active.',
              'plain paste live switch',
          )
          c = replace_once(
              c,
              '        (event) => {\n          const selection = window.getSelection();\n          const composer = getComposerFromNode(selection?.anchorNode) || getComposerFromNode(event.target);',
              '        (event) => {\n          if (!globalThis.BetterChatGPT?.isFeatureEnabled?.("composer.enabled")) return;\n          const selection = window.getSelection();\n          const composer = getComposerFromNode(selection?.anchorNode) || getComposerFromNode(event.target);',
              'plain copy live switch',
          )

          c = replace_once(c, '  if (!BCG?.isFeatureEnabled("editAttachments.enabled")) return;', '  if (!BCG) return;\n\n  const editAttachmentsEnabled = () => Boolean(BCG.isFeatureEnabled("editAttachments.enabled"));', 'always install edit attachments runtime')
          c = replace_once(c, '  function attachSession(root) {\n    if (sessions.has(root) || !(root instanceof HTMLElement)) return;', '  function attachSession(root) {\n    if (!editAttachmentsEnabled() || sessions.has(root) || !(root instanceof HTMLElement)) return;', 'edit attachment live attach')
          c = replace_once(c, '  function handleSubmitIntent(session, event) {\n    if (hasBlockingFiles(session)) {', '  function handleSubmitIntent(session, event) {\n    if (!editAttachmentsEnabled()) return;\n    if (hasBlockingFiles(session)) {', 'edit submit live switch')
          c = replace_once(
              c,
              '  function scan() {\n    scanQueued = false;\n    const roots = collectEditRoots();',
              '  function scan() {\n    scanQueued = false;\n    if (!editAttachmentsEnabled()) {\n      clearEditDragState();\n      for (const [root, session] of Array.from(sessions)) destroySession(root, session);\n      return;\n    }\n    const roots = collectEditRoots();',
              'edit sessions live disable',
          )
          c = replace_once(
              c,
              '  window.addEventListener("bcg:edit-bridge-ready", scheduleScan, { signal: dragCaptureController.signal });\n  const observer = new MutationObserver(scheduleScan);',
              '  window.addEventListener("bcg:edit-bridge-ready", scheduleScan, { signal: dragCaptureController.signal });\n  window.addEventListener("bcg:settings-changed", scheduleScan, { signal: dragCaptureController.signal });\n  const observer = new MutationObserver(scheduleScan);',
              'edit attachments settings listener',
          )

          content_path.write_text(c, encoding='utf-8')

          b = bridge_path.read_text(encoding='utf-8')
          b = replace_once(b, '!/file|library|mention|search/i.test(String(path))', '!/file|library|mention|attachment|upload/i.test(String(path))', 'bridge fetch metadata scope')
          b = replace_once(b, '/file|upload|attachment|library|mention|search/i.test(interestingPath)', '/file|upload|attachment|library|mention/i.test(interestingPath)', 'bridge xhr metadata scope')
          bridge_path.write_text(b, encoding='utf-8')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '1.1.2'
          manifest['version_name'] = '1.1-pre.2'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          f = build_ff_path.read_text(encoding='utf-8')
          f = replace_once(f, 'const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));', 'const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));\ndelete manifest.version_name;', 'strip Firefox version_name')
          f = replace_once(f, 'strict_min_version: "140.0"', 'strict_min_version: "142.0"', 'Firefox minimum version')
          build_ff_path.write_text(f, encoding='utf-8')

          w = ff_workflow_path.read_text(encoding='utf-8')
          w = w.replace('      - "tools/build-firefox.mjs"\n', '      - "tools/build-firefox.mjs"\n      - "tools/regression-check.mjs"\n')
          if w.count('tools/regression-check.mjs') != 2:
              raise RuntimeError('Firefox workflow regression-check path insertion failed')
          w = replace_once(w, '      - name: Stage Firefox build\n        shell: bash\n        run: node tools/build-firefox.mjs', '      - name: Run regression checks\n        shell: bash\n        run: node tools/regression-check.mjs\n\n      - name: Stage Firefox build\n        shell: bash\n        run: node tools/build-firefox.mjs', 'Firefox regression step')
          w = replace_once(w, "if (m.version !== '1.1') throw new Error(`Expected v1.1, got ${m.version}`);", "if (m.version !== '1.1.2') throw new Error(`Expected v1.1.2, got ${m.version}`);", 'Firefox workflow version')
          w = replace_once(w, 'BetterChatGPT-firefox-v1.1-unsigned.zip', 'BetterChatGPT-firefox-v1.1-pre.2-unsigned.zip', 'Firefox unsigned name')
          w = replace_once(w, 'BetterChatGPT-firefox-v1.1.xpi', 'BetterChatGPT-firefox-v1.1-pre.2.xpi', 'Firefox signed name')
          w = replace_once(w, 'name: BetterChatGPT-Firefox-1.1', 'name: BetterChatGPT-Firefox-v1.1-pre.2', 'Firefox artifact name')
          ff_workflow_path.write_text(w, encoding='utf-8')

          regression = r'''import fs from "node:fs";

          const content = fs.readFileSync("chromium/content.js", "utf8");
          const bridge = fs.readFileSync("chromium/page-bridge.js", "utf8");
          const manifest = JSON.parse(fs.readFileSync("chromium/manifest.json", "utf8"));
          const firefoxBuilder = fs.readFileSync("tools/build-firefox.mjs", "utf8");

          function requireText(haystack, needle, label) {
            if (!haystack.includes(needle)) throw new Error(`Missing regression guard: ${label}`);
          }
          function forbidText(haystack, needle, label) {
            if (haystack.includes(needle)) throw new Error(`Forbidden regression detected: ${label}`);
          }

          if (manifest.version !== "1.1.2" || manifest.version_name !== "1.1-pre.2") {
            throw new Error(`Unexpected Chromium version metadata: ${manifest.version} / ${manifest.version_name}`);
          }
          requireText(content, 'const VERSION = "1.1-pre.2";', "runtime pre.2 version");
          requireText(content, 'setManagedStyle(node, "color", "LinkText")', "user-bubble links stay blue");
          requireText(content, 'node.closest(\'a[href], [role="link"]\')', "link descendants excluded from bubble text color");
          requireText(content, 'return FIELD_BY_PATH.has(path) || path.startsWith("ui.");', "regular settings are live");
          forbidText(content, 'Reload ChatGPT to apply every change.', "generic settings reload requirement");
          forbidText(content, 'profile applied. Reload ChatGPT.', "profile reload requirement");

          forbidText(content, 'if (globalThis.BetterChatGPT?.isFeatureEnabled("scrolling.enabled"))', "scrolling bootstrap gate");
          forbidText(content, 'if (globalThis.BetterChatGPT?.isFeatureEnabled("composer.enabled"))', "composer bootstrap gate");
          forbidText(content, 'if (!BCG?.isFeatureEnabled("editAttachments.enabled")) return;', "edit-attachment bootstrap gate");
          requireText(content, 'win.addEventListener("bcg:settings-changed", syncRuntimeSettings);', "live scrolling settings listener");
          requireText(content, 'const queueFeatureEnabled = () => Boolean(globalThis.BetterChatGPT?.isFeatureEnabled?.("queue.enabled"));', "live queue switch");
          requireText(content, 'for (const eventName of ["paste", "drop"])', "native paste/drop file observation");
          requireText(content, '// Observe only. ChatGPT keeps full ownership of paste/drop and native upload.', "native upload ownership");
          requireText(content, 'window.addEventListener("bcg:settings-changed", scheduleScan, { signal: dragCaptureController.signal });', "live edit attachments");
          requireText(content, 'if (!globalThis.BetterChatGPT?.isFeatureEnabled?.("composer.enabled")) return;', "live composer handlers");
          requireText(content, 'bcg:native-upload-count', "native upload completion tracking");
          requireText(content, 'rememberQueuedComposerFiles', "queued attachment correlation");
          requireText(content, 'if (hasActiveNativeUpload() || isNativeComposerBusy()) return false;', "do not send during native upload");

          forbidText(bridge, '/file|library|mention|search/i', "generic search-response metadata parsing");
          forbidText(bridge, '/file|upload|attachment|library|mention|search/i', "generic XHR search-response metadata parsing");
          requireText(bridge, '/file|library|mention|attachment|upload/i', "attachment-only fetch metadata scope");

          for (const removed of [
            "Live uploads while generating",
            "Focus composer",
            "Long-chat optimizer",
            "cgpt-lco-hibernated",
            "bcg:wake-all",
            "Wake all messages",
            "uploadFilesNowOrQueue",
            "guardLiveFileDrag",
            "liveFileDragOverlay",
            "__BCG_OPTIMIZER_SUSPENDED_UNTIL",
          ]) forbidText(content, removed, removed);

          requireText(firefoxBuilder, 'delete manifest.version_name;', "Firefox strips Chromium version_name");
          requireText(firefoxBuilder, 'strict_min_version: "142.0"', "Firefox metadata permission-compatible minimum");
          console.log("BetterChatGPT pre.2 regression checks passed.");
          '''
          regression = '\n'.join(line[10:] if line.startswith('          ') else line for line in regression.splitlines()) + '\n'
          (root / 'tools/regression-check.mjs').write_text(regression, encoding='utf-8')

          old_changelog = changelog_path.read_text(encoding='utf-8')
          old_changelog = replace_once(old_changelog, '## 1.1 (pre-release) - 2026-08-29', '## 1.1-pre.1 - 2026-08-29', 'rename pre1 changelog section')
          pre2 = '''# Changelog\n\n## 1.1-pre.2 - 2026-08-29\n\n- Keep hyperlinks inside colored user bubbles on the browser-native blue link color instead of inheriting BetterChatGPT text colors.\n- Make all regular settings, profiles, imports, and section resets apply on-the-fly without requiring a ChatGPT reload. Master enable now suspends/resumes feature runtimes live; the Native hang recorder remains intentionally independent for A/B diagnostics.\n- Make Smart scrolling, Queued sending, plain-text paste/copy, and edited-message attachment enhancement react to settings changes without page reloads.\n- Harden queued native attachments during generation: observe file-input, paste, and drop File objects without preventing or replaying ChatGPT's native upload events; wait for native upload completion before releasing a queued send.\n- Narrow page-bridge attachment metadata parsing so generic tool/search responses are no longer cloned and recursively scanned.\n- Remove the final dead Long-chat optimizer UI remnant (Wake all messages).\n- Add a permanent regression checker covering removed v1.0.83 behaviors, live-setting bootstrap gates, native attachment ownership, and link styling.\n- Raise Firefox's minimum version to 142 to match Mozilla's `data_collection_permissions` manifest support and package this pre-release internally as extension version `1.1.2`.\n\n'''
          changelog_path.write_text(pre2 + old_changelog.removeprefix('# Changelog\n\n'), encoding='utf-8')

          notes = amo_notes_path.read_text(encoding='utf-8')
          notes = replace_once(notes, 'sets Firefox minimum version 140.', 'sets Firefox minimum version 142.', 'AMO minimum version note')
          amo_notes_path.write_text(notes, encoding='utf-8')

          cr = chromium_readme_path.read_text(encoding='utf-8')
          cr = cr.replace('## v1.1 highlights', '## v1.1 pre-release highlights')
          cr = cr.replace('Most layout/appearance changes apply immediately. Structural behavior is safest to test after **Reload ChatGPT**.', 'All regular settings apply immediately; **Reload ChatGPT** remains available only as a manual troubleshooting action.')
          cr = cr.replace('Better-ChatGPT-chromium-v1.1.zip', 'BetterChatGPT-chromium-v1.1-pre.2.zip')
          chromium_readme_path.write_text(cr, encoding='utf-8')
          PY

      - name: Validate runtime and regression guards
        shell: bash
        run: |
          set -euo pipefail
          node tools/regression-check.mjs
          find chromium -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          node --check tools/build-firefox.mjs
          node --check tools/regression-check.mjs

      - name: Build and lint Firefox package
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-firefox.mjs
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('build/firefox-src/manifest.json', 'utf8'));
          if (m.version !== '1.1.2') throw new Error(`Expected Firefox 1.1.2, got ${m.version}`);
          if ('version_name' in m) throw new Error('Firefox manifest must not contain Chromium version_name');
          if (m.background?.service_worker) throw new Error('Firefox service_worker declaration leaked into package');
          if (!Array.isArray(m.background?.scripts) || !m.background.scripts.includes('performance-background.js')) throw new Error('Firefox background script missing');
          if (m.browser_specific_settings?.gecko?.strict_min_version !== '142.0') throw new Error('Firefox minimum version mismatch');
          NODE
          rm -rf build/firefox
          mkdir -p build/firefox
          npx --yes web-ext@10 lint --source-dir build/firefox-src
          npx --yes web-ext@10 build --source-dir build/firefox-src --artifacts-dir build/firefox --overwrite-dest

      - name: Mozilla-sign Firefox pre.2
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AMO_JWT_ISSUER:-}"
          test -n "${AMO_JWT_SECRET:-}"
          npx --yes web-ext@10 sign \
            --source-dir build/firefox-src \
            --artifacts-dir build/firefox \
            --channel unlisted \
            --approval-timeout 3600000 \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
          signed=$(find build/firefox -maxdepth 1 -type f -name '*.xpi' | sort | tail -n 1)
          test -n "$signed"
          cp "$signed" /tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi
          unzip -t /tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi >/dev/null
          unzip -l /tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi | grep -q 'META-INF/mozilla.rsa'

      - name: Package Chromium pre.2
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip
          (cd chromium && zip -qr /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip .)
          unzip -t /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip >/dev/null
          unzip -p /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);if(m.version!=="1.1.2"||m.version_name!=="1.1-pre.2")process.exit(1)})'

      - name: Finalize docs and artifacts
        shell: bash
        run: |
          set -euo pipefail
          chromium_sha=$(sha256sum /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip | awk '{print $1}')
          firefox_sha=$(sha256sum /tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi | awk '{print $1}')
          export chromium_sha firefox_sha
          rm -f artifacts/BetterChatGPT-chromium-v1.1.zip artifacts/BetterChatGPT-firefox-v1.1.xpi
          cp /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip artifacts/
          cp /tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi artifacts/
          printf '%s  %s\n%s  %s\n' \
            "$chromium_sha" 'BetterChatGPT-chromium-v1.1-pre.2.zip' \
            "$firefox_sha" 'BetterChatGPT-firefox-v1.1-pre.2.xpi' \
            > artifacts/SHA256SUMS.txt
          python3 <<'PY'
          from pathlib import Path
          import os, re
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('## v1.1 highlights', '## v1.1 pre-release highlights')
          text = re.sub(
              r'\*\*\[Download BetterChatGPT v1\.1 for Chromium/Edge\]\([^\n]+\)\*\*\n\nSHA-256: `[^`]+`',
              f'**[Download BetterChatGPT v1.1 pre.2 for Chromium/Edge](https://github.com/marcmy/BetterChatGPT/raw/main/artifacts/BetterChatGPT-chromium-v1.1-pre.2.zip)**\\n\\nSHA-256: `{os.environ["chromium_sha"]}`',
              text,
          )
          text = re.sub(
              r'\*\*\[Download Mozilla-signed BetterChatGPT v1\.1 for Firefox\]\([^\n]+\)\*\*\n\nSHA-256: `[^`]+`',
              f'**[Download Mozilla-signed BetterChatGPT v1.1 pre.2 for Firefox](https://github.com/marcmy/BetterChatGPT/raw/main/artifacts/BetterChatGPT-firefox-v1.1-pre.2.xpi)**\\n\\nSHA-256: `{os.environ["firefox_sha"]}`',
              text,
          )
          text = text.replace('Most layout/appearance changes apply immediately. Structural behavior is safest to test after **Reload ChatGPT**.', 'All regular settings apply immediately; **Reload ChatGPT** remains available only as a manual troubleshooting action.')
          text = text.replace('produces `BetterChatGPT-firefox-v1.1.xpi` as an Actions artifact.', 'produces the current versioned signed XPI as an Actions artifact.')
          p.write_text(text, encoding='utf-8')
          PY
          node tools/regression-check.mjs
          sha256sum -c artifacts/SHA256SUMS.txt --ignore-missing

      - name: Commit clean pre.2 tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chromium tools .github/workflows/firefox.yml README.md CHANGELOG.md AMO_REVIEW_NOTES.md artifacts
          git commit -m 'Prepare BetterChatGPT v1.1 pre.2'
          git push origin HEAD:main
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove one-off publisher
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pre2-release.yml
          git commit -m 'Remove one-off pre.2 publisher'
          git push origin HEAD:main
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.cleanup.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## BetterChatGPT v1.1 pre.2

          Regression-focused follow-up to pre.1.

          ### Fixes and hardening
          - User-bubble hyperlinks now stay blue instead of inheriting custom bubble/conversation text colors.
          - All regular settings, profiles, imports, and section resets now apply live without reloading ChatGPT.
          - Smart scrolling, queued sending, plain-text paste/copy, and edited-message attachments can be enabled/disabled on-the-fly.
          - Native files pasted, dropped, or selected while ChatGPT is generating remain owned by ChatGPT; BetterChatGPT only observes them so queued send can wait for upload completion and correlate attachment metadata.
          - Generic tool/search JSON is no longer cloned and recursively parsed as possible attachment metadata.
          - Removed the final dead Long-chat optimizer UI remnant (Wake all messages).
          - Added permanent regression checks to prevent removed v1.0.83 takeover/optimizer code from creeping back in.

          ### Browser packages
          - `BetterChatGPT-chromium-v1.1-pre.2.zip` — Chrome / Edge (`version_name` 1.1-pre.2, manifest version 1.1.2)
          - `BetterChatGPT-firefox-v1.1-pre.2.xpi` — Mozilla-signed Firefox build (AMO extension version 1.1.2)
          - `SHA256SUMS.txt` — checksums for both packages

          The Native hang recorder remains intentionally active when Master enable is off so native ChatGPT/tool-call freezes can still be A/B diagnosed.
          EOF
          gh release create v1.1-pre.2 \
            artifacts/BetterChatGPT-chromium-v1.1-pre.2.zip \
            artifacts/BetterChatGPT-firefox-v1.1-pre.2.xpi \
            artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "BetterChatGPT v1.1 pre.2" \
            --notes-file /tmp/release-notes.md \
            --prerelease
