name: Recover and finalize BetterChatGPT v1.1 pre.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pre2-recover.yml"

permissions:
  contents: write

env:
  AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
  AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Recreate the validated pre.2 source tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/firefox.yml /tmp/firefox-dynamic.yml
          git show v1.1-pre.1:.github/workflows/firefox.yml > .github/workflows/firefox.yml
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          p = Path('chromium/content.js')
          text = p.read_text(encoding='utf-8')
          old = 'notify(reloadRequired ? "Saved. Reload ChatGPT to apply every change." : "Saved.");'
          new = 'notify(reloadRequired ? "Saved. Reload ChatGPT to apply this structural change." : "Saved.");'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one generic reload fallback, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/pre2-release.yml').read_text(encoding='utf-8')
          start = workflow.index('      - name: Apply pre.2 fixes\n')
          run_start = workflow.index('        run: |\n', start) + len('        run: |\n')
          end = workflow.index('\n      - name: Validate runtime and regression guards', run_start)
          Path('/tmp/apply-pre2.sh').write_text(textwrap.dedent(workflow[run_start:end]), encoding='utf-8')
          PY
          bash /tmp/apply-pre2.sh
          cp /tmp/firefox-dynamic.yml .github/workflows/firefox.yml
          git diff --exit-code -- .github/workflows/firefox.yml

      - name: Re-run source regression checks
        shell: bash
        run: |
          set -euo pipefail
          node tools/regression-check.mjs
          find chromium -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          node --check tools/build-firefox.mjs
          node tools/build-firefox.mjs
          node - <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('chromium/manifest.json', 'utf8'));
          const firefox = JSON.parse(fs.readFileSync('build/firefox-src/manifest.json', 'utf8'));
          if (source.version !== '1.1.2' || source.version_name !== '1.1-pre.2') throw new Error('Chromium pre.2 version metadata mismatch');
          if (firefox.version !== '1.1.2') throw new Error(`Expected Firefox 1.1.2, got ${firefox.version}`);
          if ('version_name' in firefox) throw new Error('Firefox package contains Chromium version_name');
          if (firefox.browser_specific_settings?.gecko?.strict_min_version !== '142.0') throw new Error('Firefox minimum version mismatch');
          NODE

      - name: Recover Mozilla-signed Firefox 1.1.2 from AMO
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, hmac, json, os, time, uuid
          import urllib.request, urllib.error
          from pathlib import Path

          issuer = os.environ['AMO_JWT_ISSUER']
          secret = os.environ['AMO_JWT_SECRET'].encode()

          def b64url(data):
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          now = int(time.time())
          header = {'alg': 'HS256', 'typ': 'JWT'}
          payload = {'iss': issuer, 'jti': str(uuid.uuid4()), 'iat': now, 'exp': now + 90}
          signing_input = f"{b64url(json.dumps(header, separators=(',', ':')).encode())}.{b64url(json.dumps(payload, separators=(',', ':')).encode())}"
          signature = hmac.new(secret, signing_input.encode(), hashlib.sha256).digest()
          token = f"{signing_input}.{b64url(signature)}"
          auth = {'Authorization': f'JWT {token}', 'User-Agent': 'BetterChatGPT-release-recovery/1.1-pre.2'}

          base = 'https://addons.mozilla.org/api/v5/addons/addon/3062261/versions/'
          detail_url = base + 'v1.1.2/'

          def get_json(url):
              req = urllib.request.Request(url, headers=auth)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          try:
              version = get_json(detail_url)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              listing = get_json(base + '?filter=all_with_unlisted&page_size=50')
              matches = [v for v in listing.get('results', []) if str(v.get('version')) == '1.1.2']
              if not matches:
                  raise RuntimeError('AMO version 1.1.2 was not found in the unlisted version list')
              version = matches[0]

          file_info = version.get('file') or {}
          if not file_info.get('is_mozilla_signed_extension'):
              raise RuntimeError('AMO reports Firefox 1.1.2 is not Mozilla-signed')
          file_url = file_info.get('url')
          if not file_url:
              raise RuntimeError('AMO did not return a signed file URL for 1.1.2')

          request = urllib.request.Request(file_url, headers={'User-Agent': auth['User-Agent']})
          with urllib.request.urlopen(request, timeout=120) as r:
              data = r.read()

          digest = hashlib.sha256(data).hexdigest()
          expected = str(file_info.get('hash') or '')
          if expected.startswith('sha256:') and digest.lower() != expected.split(':', 1)[1].lower():
              raise RuntimeError(f'AMO signed XPI hash mismatch: {digest} != {expected}')

          out = Path('/tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi')
          out.write_bytes(data)
          print(f"Recovered signed AMO Firefox {version.get('version')} XPI: {len(data)} bytes, sha256:{digest}")
          PY
          unzip -t /tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi >/dev/null
          unzip -l /tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi | grep -q 'META-INF/mozilla.rsa'

      - name: Build Chromium pre.2 and finalize artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip
          (cd chromium && zip -qr /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip .)
          unzip -t /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip >/dev/null

          chromium_sha=$(sha256sum /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip | awk '{print $1}')
          firefox_sha=$(sha256sum /tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi | awk '{print $1}')
          export chromium_sha firefox_sha

          rm -f artifacts/BetterChatGPT-chromium-v1.1.zip artifacts/BetterChatGPT-firefox-v1.1.xpi
          cp /tmp/BetterChatGPT-chromium-v1.1-pre.2.zip artifacts/
          cp /tmp/BetterChatGPT-firefox-v1.1-pre.2.xpi artifacts/
          printf '%s  %s\n%s  %s\n' \
            "$chromium_sha" 'BetterChatGPT-chromium-v1.1-pre.2.zip' \
            "$firefox_sha" 'BetterChatGPT-firefox-v1.1-pre.2.xpi' \
            > artifacts/SHA256SUMS.txt

          python3 <<'PY'
          from pathlib import Path
          import os, re

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('## v1.1 highlights', '## v1.1 pre-release highlights')
          text = re.sub(
              r'\*\*\[Download BetterChatGPT v1\.1 for Chromium/Edge\]\([^\n]+\)\*\*\n\nSHA-256: `[^`]+`',
              f'**[Download BetterChatGPT v1.1 pre.2 for Chromium/Edge](https://github.com/marcmy/BetterChatGPT/raw/main/artifacts/BetterChatGPT-chromium-v1.1-pre.2.zip)**\n\nSHA-256: `{os.environ["chromium_sha"]}`',
              text,
          )
          text = re.sub(
              r'\*\*\[Download Mozilla-signed BetterChatGPT v1\.1 for Firefox\]\([^\n]+\)\*\*\n\nSHA-256: `[^`]+`',
              f'**[Download Mozilla-signed BetterChatGPT v1.1 pre.2 for Firefox](https://github.com/marcmy/BetterChatGPT/raw/main/artifacts/BetterChatGPT-firefox-v1.1-pre.2.xpi)**\n\nSHA-256: `{os.environ["firefox_sha"]}`',
              text,
          )
          text = text.replace('Most layout/appearance changes apply immediately. Structural behavior is safest to test after **Reload ChatGPT**.', 'All regular settings apply immediately; **Reload ChatGPT** remains available only as a manual troubleshooting action.')
          text = text.replace('produces `BetterChatGPT-firefox-v1.1.xpi` as an Actions artifact.', 'produces the current versioned signed XPI as an Actions artifact.')
          p.write_text(text, encoding='utf-8')
          PY

          node tools/regression-check.mjs
          (cd artifacts && sha256sum -c SHA256SUMS.txt)
          git diff --check -- chromium tools README.md CHANGELOG.md AMO_REVIEW_NOTES.md artifacts

      - name: Commit validated pre.2 source and packages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chromium tools README.md CHANGELOG.md AMO_REVIEW_NOTES.md artifacts
          git diff --cached --check
          git commit -m 'Prepare BetterChatGPT v1.1 pre.2'
          git push origin HEAD:main
