name: Remove stale pre-Firefox v1.1 tag

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-stale-v1.1-tag.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete stale v1.1 tag
        shell: bash
        run: |
          set -euo pipefail
          git push origin :refs/tags/v1.1
